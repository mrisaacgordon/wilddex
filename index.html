<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WildDex — Indiana Wildlife Field Guide</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: #1a1f1a; color: #e8e4d8; min-height: 100vh; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; background: #1a1f1a; }
  .auth-card { background: #232820; border: 1px solid #3a4232; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 380px; }
  .auth-logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #8fba6e; text-align: center; margin-bottom: 4px; }
  .auth-sub { text-align: center; color: #7a8c6a; font-size: 13px; margin-bottom: 2rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .auth-tabs { display: flex; margin-bottom: 1.5rem; border: 1px solid #3a4232; border-radius: 8px; overflow: hidden; }
  .auth-tab { flex: 1; padding: 10px; background: none; border: none; color: #7a8c6a; font-family: 'Source Sans 3', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .auth-tab.active { background: #3a4232; color: #c8d8b0; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; color: #7a8c6a; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 10px 12px; background: #1a1f1a; border: 1px solid #3a4232; border-radius: 8px; color: #e8e4d8; font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .field input:focus, .field textarea:focus { border-color: #8fba6e; }
  .field textarea { resize: vertical; min-height: 120px; }
  .btn-primary { width: 100%; padding: 12px; background: #5a8a3a; border: none; border-radius: 8px; color: #e8f4d8; font-family: 'Source Sans 3', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
  .btn-primary:hover { background: #6aa048; }
  .auth-error { color: #e07070; font-size: 13px; margin-top: 0.75rem; text-align: center; }
  .header { background: #1a1f1a; border-bottom: 1px solid #2e3828; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-family: 'Playfair Display', serif; font-size: 20px; color: #8fba6e; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .header-user { font-size: 13px; color: #7a8c6a; }
  .btn-logout { padding: 6px 14px; background: none; border: 1px solid #3a4232; border-radius: 6px; color: #7a8c6a; font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .btn-logout:hover { border-color: #8fba6e; color: #8fba6e; }
  .nav { background: #1e241e; border-bottom: 1px solid #2e3828; display: flex; overflow-x: auto; padding: 0 1rem; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-tab { padding: 12px 20px; background: none; border: none; border-bottom: 2px solid transparent; color: #7a8c6a; font-family: 'Source Sans 3', sans-serif; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .nav-tab.active { color: #8fba6e; border-bottom-color: #8fba6e; }
  .nav-tab:hover { color: #c8d8b0; }
  .main { flex: 1; padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }
  .stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat-card { background: #232820; border: 1px solid #2e3828; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 110px; }
  .stat-label { font-size: 11px; color: #7a8c6a; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #8fba6e; }
  .progress-bar { height: 4px; background: #2e3828; border-radius: 2px; margin-top: 6px; }
  .progress-fill { height: 100%; background: #5a8a3a; border-radius: 2px; transition: width 0.4s; }
  .controls { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
  .search-input { flex: 1; min-width: 180px; padding: 9px 14px; background: #232820; border: 1px solid #2e3828; border-radius: 8px; color: #e8e4d8; font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: #8fba6e; }
  .filter-btn { padding: 9px 14px; background: #232820; border: 1px solid #2e3828; border-radius: 8px; color: #7a8c6a; font-family: 'Source Sans 3', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .filter-btn.active { background: #2e3828; color: #c8d8b0; border-color: #4a5a3a; }
  .edit-groups-btn { padding: 9px 16px; background: #2e3828; border: 1px solid #4a5a3a; border-radius: 8px; color: #8fba6e; font-family: 'Source Sans 3', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .edit-groups-btn:hover { background: #3a4a2a; }
  .species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .species-card { background: #232820; border: 1px solid #2e3828; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; }
  .species-card:hover { border-color: #4a5a3a; transform: translateY(-2px); }
  .species-card.captured { border-color: #5a8a3a; }
  .species-photo { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #1a1f1a; position: relative; overflow: hidden; }
  .species-photo img { width: 100%; height: 100%; object-fit: cover; }
  .species-photo.empty { background: #1e241e; }
  .question-mark { font-size: 42px; color: #2e3828; }
  .captured-badge { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #5a8a3a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #e8f4d8; }
  .species-info { padding: 10px 10px 12px; }
  .species-num { font-size: 10px; color: #5a6a4a; letter-spacing: 0.06em; margin-bottom: 2px; }
  .species-name { font-size: 12px; font-weight: 600; color: #c8d8b0; line-height: 1.3; margin-bottom: 2px; }
  .species-sci { font-size: 10px; color: #5a6a4a; font-style: italic; line-height: 1.2; }
  .species-tag { display: inline-block; margin-top: 6px; padding: 2px 7px; font-size: 10px; border-radius: 4px; }
  .tag-snake { background: #3a1a1a; color: #d08080; }
  .tag-lizard { background: #1a2a3a; color: #80a8d0; }
  .tag-turtle { background: #1a2a1a; color: #80b880; }
  .tag-salamander { background: #2a1a3a; color: #a880c8; }
  .tag-frog { background: #1a2a2a; color: #80c8b8; }
  .tag-bird { background: #2a2a1a; color: #c8c080; }
  .tag-custom { background: #2a1a2a; color: #c880a8; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
  .modal { background: #232820; border: 1px solid #3a4232; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #2e3828; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; color: #c8d8b0; }
  .modal-sci { font-size: 13px; color: #5a6a4a; font-style: italic; margin-top: 2px; }
  .modal-close { background: none; border: none; color: #5a6a4a; font-size: 24px; cursor: pointer; line-height: 1; padding: 2px; flex-shrink: 0; }
  .modal-body { padding: 1.5rem; }
  .modal-photo { width: 100%; aspect-ratio: 16/9; background: #1a1f1a; border-radius: 10px; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #2e3828; }
  .modal-photo img { width: 100%; height: 100%; object-fit: cover; }
  .modal-photo.empty { flex-direction: column; gap: 8px; }
  .upload-hint { font-size: 13px; color: #5a6a4a; }
  .upload-btn { display: block; padding: 10px 20px; background: #2e3828; border: 1px dashed #4a5a3a; border-radius: 8px; color: #8fba6e; font-family: 'Source Sans 3', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center; width: 100%; margin-bottom: 0.75rem; }
  .upload-btn:hover { background: #3a4232; }
  input[type=file] { display: none; }
  .modal-meta { font-size: 13px; color: #7a8c6a; line-height: 1.7; }
  .modal-meta strong { color: #c8d8b0; }
  .btn-remove { margin-top: 0.75rem; padding: 8px 16px; background: none; border: 1px solid #4a2a2a; border-radius: 6px; color: #a06060; font-family: 'Source Sans 3', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .btn-remove:hover { background: #2a1a1a; }
  .empty-state { text-align: center; padding: 4rem 1rem; color: #5a6a4a; font-size: 15px; }
  .eg-tabs { display: flex; border: 1px solid #3a4232; border-radius: 8px; overflow: hidden; margin-bottom: 1.25rem; }
  .eg-tab { flex: 1; padding: 9px; background: none; border: none; color: #7a8c6a; font-family: 'Source Sans 3', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .eg-tab.active { background: #3a4232; color: #c8d8b0; }
  .group-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .group-row { display: flex; align-items: center; justify-content: space-between; background: #1e241e; border: 1px solid #2e3828; border-radius: 8px; padding: 10px 14px; gap: 8px; }
  .group-row-name { font-size: 14px; color: #c8d8b0; }
  .group-row-count { font-size: 12px; color: #5a6a4a; }
  .group-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { padding: 5px 12px; border-radius: 6px; font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; border: 1px solid #3a4232; background: none; color: #7a8c6a; transition: all 0.2s; white-space: nowrap; }
  .btn-sm:hover { color: #c8d8b0; border-color: #4a5a3a; }
  .btn-sm.danger { border-color: #4a2a2a; color: #a06060; }
  .btn-sm.danger:hover { background: #2a1a1a; }
  .btn-sm.primary { border-color: #4a6a2a; color: #8fba6e; }
  .btn-sm.primary:hover { background: #2e3828; }
  .divider { border: none; border-top: 1px solid #2e3828; margin: 1rem 0; }
  .eg-section-title { font-size: 12px; color: #5a6a4a; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.75rem; }
  .species-edit-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; margin-bottom: 1rem; }
  .species-edit-row { display: flex; align-items: center; justify-content: space-between; background: #1e241e; border: 1px solid #2e3828; border-radius: 6px; padding: 8px 12px; gap: 8px; }
  .species-edit-name { font-size: 13px; color: #c8d8b0; }
  .species-edit-sci { font-size: 11px; color: #5a6a4a; font-style: italic; }
  .add-species-row { display: flex; gap: 8px; margin-top: 0.5rem; flex-wrap: wrap; }
  .add-species-row input { flex: 1; min-width: 120px; padding: 8px 12px; background: #1a1f1a; border: 1px solid #3a4232; border-radius: 6px; color: #e8e4d8; font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; }
  .add-species-row input:focus { border-color: #8fba6e; }
  .btn-add-sp { padding: 8px 14px; background: #2e3828; border: 1px solid #4a5a3a; border-radius: 6px; color: #8fba6e; font-family: 'Source Sans 3', sans-serif; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn-add-sp:hover { background: #3a4a2a; }
  .notice { font-size: 12px; color: #5a6a4a; font-style: italic; margin-top: 6px; }
  .inline-err { color: #e07070; font-size: 12px; margin-top: 6px; min-height: 18px; }
  @media (max-width: 500px) {
    .species-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .main { padding: 1rem; }
    .stats-bar { gap: 8px; }
    .stat-card { padding: 10px 12px; }
    .controls { gap: 8px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- AUTH -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">WildDex</div>
      <div class="auth-sub">Indiana Wildlife Field Guide</div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Create Account</button>
      </div>
      <div class="field"><label>Username</label><input type="text" id="auth-username" placeholder="your username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Sign In</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" style="display:none; flex-direction:column; min-height:100vh;">
    <div class="header">
      <div class="header-logo">WildDex</div>
      <div class="header-right">
        <span class="header-user" id="header-user"></span>
        <button class="btn-logout" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="nav" id="nav-tabs"></div>
    <div class="main">
      <div class="stats-bar" id="stats-bar"></div>
      <div class="controls">
        <input type="text" class="search-input" id="search-input" placeholder="Search species..." oninput="renderGrid()">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filter-captured" onclick="setFilter('captured')">Photographed</button>
        <button class="filter-btn" id="filter-missing" onclick="setFilter('missing')">Still needed</button>
        <button class="edit-groups-btn" onclick="showEditGroups()">Edit groups</button>
      </div>
      <div class="species-grid" id="species-grid"></div>
    </div>
  </div>

  <!-- SPECIES MODAL -->
  <div class="modal-overlay" id="species-modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-name"></div>
          <div class="modal-sci" id="modal-sci"></div>
        </div>
        <button class="modal-close" onclick="closeSpeciesModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-photo" id="modal-photo-wrap"></div>
        <label class="upload-btn" for="file-input">Upload your photo</label>
        <input type="file" id="file-input" accept="image/*" onchange="handleUpload(event)">
        <div id="modal-remove-btn"></div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
    </div>
  </div>

  <!-- EDIT GROUPS MODAL -->
  <div class="modal-overlay" id="editgroups-modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" style="max-width:560px" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">Edit groups</div>
        <button class="modal-close" onclick="document.getElementById('editgroups-modal').style.display='none'">×</button>
      </div>
      <div class="modal-body" id="editgroups-body"></div>
    </div>
  </div>

</div>
<script>
const SPECIES_DATA = {
  snakes: { label:"Snakes", color:"tag-snake", species:[

    {name:"Eastern Racer",sci:"Coluber constrictor",notes:"Fast, slender snake. Harmless but defensive. Open fields and woodland edges."},
    {name:"Ring-necked Snake",sci:"Diadophis punctatus",notes:"Small, secretive. Orange ring around neck. Under logs and rocks."},
    {name:"DeKay's Brownsnake",sci:"Storeria dekayi",notes:"Small, urban-tolerant. Common in gardens and parks."},
    {name:"Red-bellied Snake",sci:"Storeria occipitomaculata",notes:"Tiny snake with bright red belly. Forest edges."},
    {name:"Eastern Milksnake",sci:"Lampropeltis triangulum",notes:"Often mistaken for copperhead. Beautiful pattern. Harmless."},
    {name:"Black Kingsnake",sci:"Lampropeltis nigra",notes:"Glossy black. Eats other snakes including venomous species."},
    {name:"Smooth Green Snake",sci:"Opheodrys vernalis",notes:"Bright emerald green. Grasslands and meadows."},
    {name:"Rough Green Snake",sci:"Opheodrys aestivus",notes:"Slender, arboreal. Found in shrubs overhanging water."},
    {name:"Eastern Hog-nosed Snake",sci:"Heterodon platirhinos",notes:"Dramatic death-feigning behavior. Upturned snout."},
    {name:"Eastern Ratsnake",sci:"Pantherophis alleghaniensis",notes:"Large, excellent climber. Old farm country staple."},

    {name:"Kirtland's Snake",sci:"Clonophis kirtlandii",notes:"Rare. Wetland species. State Species of Special Concern."},
    {name:"Western Ribbonsnake",sci:"Thamnophis proximus",notes:"Slender, striped. Wetland edges."},
    {name:"Massasauga Rattlesnake",sci:"Sistrurus catenatus",notes:"VENOMOUS. State endangered. Small rattlesnake of wetlands."},
    {name:"Timber Rattlesnake",sci:"Crotalus horridus",notes:"VENOMOUS. State special concern. Forest and rocky outcrops."},
    {name:"Eastern Copperhead",sci:"Agkistrodon contortrix",notes:"VENOMOUS. Hourglass pattern. Southern Indiana forests."},

    {name:"Graham's Crayfish Snake",sci:"Regina grahamii",notes:"Prairie wetlands. Feeds on crayfish."},
  ]},
  lizards: { label:"Lizards", color:"tag-lizard", species:[

    {name:"Broad-headed Skink",sci:"Plestiodon laticeps",notes:"Largest Indiana skink. Males have reddish-orange head."},

    {name:"Six-lined Racerunner",sci:"Aspidoscelis sexlineata",notes:"Fast. Open sandy areas. Southern Indiana."},

    {name:"Eastern Musk Turtle",sci:"Sternotherus odoratus",notes:"Small, aquatic. Releases musky odor when handled."},

  salamanders: { label:"Salamanders", color:"tag-salamander", species:[

    {name:"Jefferson Salamander",sci:"Ambystoma jeffersonianum",notes:"Early spring breeder. Slate gray, long limbs."},

let currentUser=null, allUsers={}, currentGroup='snakes', currentFilter='all', currentSpecies=null, authMode='login', egMode='manage', egEditKey=null;

function loadData(){try{const d=localStorage.getItem('wilddex_users');if(d)allUsers=JSON.parse(d);}catch(e){}}
function saveData(){try{localStorage.setItem('wilddex_users',JSON.stringify(allUsers));}catch(e){}}
function switchAuthTab(mode){authMode=mode;document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&mode==='login')||(i===1&&mode==='register')));document.getElementById('auth-error').textContent='';document.getElementById('auth-btn').textContent=mode==='login'?'Sign In':'Create Account';}
function handleAuth(){const u=document.getElementById('auth-username').value.trim(),p=document.getElementById('auth-password').value,err=document.getElementById('auth-error');if(!u||!p){err.textContent='Please fill in all fields.';return;}if(authMode==='register'){if(allUsers[u]){err.textContent='Username already taken.';return;}if(p.length<4){err.textContent='Password must be at least 4 characters.';return;}allUsers[u]={password:p,photos:{},customGroups:{},removedSpecies:{}};}else{if(!allUsers[u]||allUsers[u].password!==p){err.textContent='Invalid username or password.';return;}}saveData();currentUser=u;if(!allUsers[u].customGroups)allUsers[u].customGroups={};if(!allUsers[u].removedSpecies)allUsers[u].removedSpecies={};document.getElementById('auth-screen').style.display='none';document.getElementById('main-app').style.display='flex';document.getElementById('header-user').textContent=u;buildNav();renderStats();renderGrid();}
function logout(){currentUser=null;document.getElementById('auth-screen').style.display='flex';document.getElementById('main-app').style.display='none';document.getElementById('auth-username').value='';document.getElementById('auth-password').value='';}
function getCustomGroups(){return allUsers[currentUser]?.customGroups||{};}
function getAllGroups(){const removals=allUsers[currentUser]?.removedSpecies||{};const built=Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,label:v.label,color:v.color,builtin:true,species:v.species.filter(s=>!(removals[k]||[]).includes(s.sci))}));const cg=getCustomGroups();const custom=Object.entries(cg).map(([k,v])=>({key:'custom_'+k,label:k,color:'tag-custom',builtin:false,species:v.species||[]}));return[...built,...custom];}
function buildNav(){const nav=document.getElementById('nav-tabs');nav.innerHTML='';getAllGroups().forEach(g=>{const btn=document.createElement('button');btn.className='nav-tab'+(g.key===currentGroup?' active':'');btn.textContent=g.label;btn.onclick=()=>{currentGroup=g.key;currentFilter='all';document.getElementById('search-input').value='';buildNav();renderStats();renderGrid();};nav.appendChild(btn);});}
function getUserPhotos(){return allUsers[currentUser]?.photos||{};}
function getCurrentGroupData(){return getAllGroups().find(g=>g.key===currentGroup)||getAllGroups()[0];}
function renderStats(){const group=getCurrentGroupData(),photos=getUserPhotos(),total=group.species.length,captured=group.species.filter(s=>photos[currentGroup+'_'+s.sci]).length,pct=total>0?Math.round(captured/total*100):0;document.getElementById('stats-bar').innerHTML=`<div class="stat-card"><div class="stat-label">${group.label} photographed</div><div class="stat-value">${captured} / ${total}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="stat-card"><div class="stat-label">Completion</div><div class="stat-value">${pct}%</div></div><div class="stat-card"><div class="stat-label">Still needed</div><div class="stat-value">${total-captured}</div></div>`;}
function setFilter(f){currentFilter=f;['all','captured','missing'].forEach(x=>document.getElementById('filter-'+x).classList.toggle('active',x===f));renderGrid();}
function renderGrid(){const group=getCurrentGroupData(),photos=getUserPhotos(),search=document.getElementById('search-input').value.toLowerCase();let species=group.species.filter(s=>{const has=!!photos[currentGroup+'_'+s.sci];if(currentFilter==='captured'&&!has)return false;if(currentFilter==='missing'&&has)return false;if(search&&!s.name.toLowerCase().includes(search)&&!s.sci.toLowerCase().includes(search))return false;return true;});const grid=document.getElementById('species-grid');if(!species.length){grid.innerHTML='<div class="empty-state">No species match your filters.</div>';return;}grid.innerHTML=species.map((s,i)=>{const key=currentGroup+'_'+s.sci,photo=photos[key],num=String(group.species.indexOf(s)+1).padStart(3,'0');return`<div class="species-card ${photo?'captured':''}" onclick="openSpecies('${currentGroup}','${s.sci.replace(/'/g,"\\'")}')"><div class="species-photo ${photo?'':'empty'}">${photo?`<img src="${photo}" alt="${s.name}">`:'<div class="question-mark">?</div>'}${photo?'<div class="captured-badge">✓</div>':''}</div><div class="species-info"><div class="species-num">#${num}</div><div class="species-name">${s.name}</div><div class="species-sci">${s.sci}</div><span class="species-tag ${group.color}">${group.label.replace(/s$/,'').replace(/ & Toads$/,'')}</span></div></div>`;}).join('');}
function openSpecies(groupKey,sci){const group=getAllGroups().find(g=>g.key===groupKey),s=group?.species.find(sp=>sp.sci===sci);if(!s)return;currentSpecies={groupKey,sci};const photos=getUserPhotos(),key=groupKey+'_'+sci,photo=photos[key];document.getElementById('modal-name').textContent=s.name;document.getElementById('modal-sci').textContent=s.sci;const wrap=document.getElementById('modal-photo-wrap');if(photo){wrap.className='modal-photo';wrap.innerHTML=`<img src="${photo}" alt="${s.name}">`;}else{wrap.className='modal-photo empty';wrap.innerHTML='<div class="question-mark" style="font-size:48px;color:#2e3828">?</div><div class="upload-hint">No photo yet</div>';}document.getElementById('modal-remove-btn').innerHTML=photo?'<button class="btn-remove" onclick="removePhoto()">Remove photo</button>':'';document.getElementById('modal-meta').innerHTML=`<strong>Notes:</strong> ${s.notes||'No notes available.'}`;document.getElementById('species-modal').style.display='flex';}
function closeSpeciesModal(){document.getElementById('species-modal').style.display='none';document.getElementById('file-input').value='';currentSpecies=null;}
function closeModal(e){if(e.target.classList.contains('modal-overlay')){document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none');currentSpecies=null;document.getElementById('file-input').value='';}}
function handleUpload(event){const file=event.target.files[0];if(!file||!currentSpecies)return;const reader=new FileReader();reader.onload=e=>{if(!allUsers[currentUser].photos)allUsers[currentUser].photos={};allUsers[currentUser].photos[currentSpecies.groupKey+'_'+currentSpecies.sci]=e.target.result;saveData();openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();};reader.readAsDataURL(file);}
function removePhoto(){if(!currentSpecies)return;delete allUsers[currentUser].photos[currentSpecies.groupKey+'_'+currentSpecies.sci];saveData();openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();}
function showEditGroups(){egMode='manage';egEditKey=null;renderEditGroups();document.getElementById('editgroups-modal').style.display='flex';}
function renderEditGroups(){const body=document.getElementById('editgroups-body'),cg=getCustomGroups(),allG=[...Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,rawKey:k,label:v.label,builtin:true,count:getAllGroups().find(g=>g.key===k)?.species.length??v.species.length})),...Object.entries(cg).map(([k,v])=>({key:'custom_'+k,rawKey:k,label:k,builtin:false,count:(v.species||[]).length}))];if(egMode==='manage'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab active">Manage groups</button><button class="eg-tab" onclick="egMode='add';renderEditGroups()">+ Add new group</button></div><div class="group-list">${allG.map(g=>`<div class="group-row"><div><div class="group-row-name">${g.label}</div><div class="group-row-count">${g.count} species${g.builtin?' · built-in':''}</div></div><div class="group-row-actions"><button class="btn-sm primary" onclick="egEdit('${g.key}')">Edit species</button>${!g.builtin?`<button class="btn-sm danger" onclick="egDeleteGroup('${g.rawKey}')">Delete</button>`:''}</div></div>`).join('')}</div>`;}else if(egMode==='add'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Add new group</button></div><div class="field"><label>Group name</label><input type="text" id="eg-new-name" placeholder="e.g. Dragonflies, Mammals..."></div><div class="field"><label>Species — one per line</label><textarea id="eg-new-species" placeholder="Common Name | Scientific Name | Notes (optional)&#10;Eastern Darner | Aeshna verticalis | A large blue dragonfly"></textarea><div class="notice">Format: Common Name | Scientific Name | Notes</div></div><button class="btn-primary" onclick="egAddGroup()">Create group</button><div class="inline-err" id="eg-add-err"></div>`;}else if(egMode==='edit'){const isBuiltin=!egEditKey.startsWith('custom_'),group=getAllGroups().find(g=>g.key===egEditKey),species=group?.species||[];body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Editing: ${group?.label||egEditKey}</button></div><div class="eg-section-title">Current species (${species.length})</div><div class="species-edit-list">${species.map((s,i)=>`<div class="species-edit-row"><div><div class="species-edit-name">${s.name}</div><div class="species-edit-sci">${s.sci}</div></div><button class="btn-sm danger" onclick="egRemoveSpecies(${i})">Remove</button></div>`).join('')||'<div style="color:#5a6a4a;font-size:13px;padding:8px 0">No species yet.</div>'}</div><hr class="divider"><div class="eg-section-title">Add species</div><div class="add-species-row"><input type="text" id="eg-sp-name" placeholder="Common name"><input type="text" id="eg-sp-sci" placeholder="Scientific name"><input type="text" id="eg-sp-notes" placeholder="Notes (optional)"><button class="btn-add-sp" onclick="egAddSpecies()">Add</button></div><div class="inline-err" id="eg-sp-err"></div>${isBuiltin?'<div class="notice" style="margin-top:8px">Removals on built-in groups are saved per account.</div>':''}`;}}
function egEdit(key){egMode='edit';egEditKey=key;renderEditGroups();}
function egDeleteGroup(rawKey){if(!confirm('Delete group "'+rawKey+'"? This cannot be undone.'))return;delete allUsers[currentUser].customGroups[rawKey];saveData();if(currentGroup==='custom_'+rawKey)currentGroup='snakes';buildNav();renderStats();renderGrid();renderEditGroups();}
function egAddGroup(){const name=document.getElementById('eg-new-name').value.trim(),err=document.getElementById('eg-add-err');if(!name){err.textContent='Please enter a group name.';return;}const cg=getCustomGroups();if(cg[name]){err.textContent='A group with that name already exists.';return;}const lines=document.getElementById('eg-new-species').value.split('\n').filter(l=>l.trim()),species=lines.map(l=>{const p=l.split('|');return{name:(p[0]||'').trim(),sci:(p[1]||p[0]||'').trim(),notes:(p[2]||'').trim()};}).filter(s=>s.name);allUsers[currentUser].customGroups[name]={species};saveData();currentGroup='custom_'+name;buildNav();renderStats();renderGrid();egMode='manage';renderEditGroups();}
function egRemoveSpecies(index){const isBuiltin=!egEditKey.startsWith('custom_');if(isBuiltin){if(!allUsers[currentUser].removedSpecies)allUsers[currentUser].removedSpecies={};if(!allUsers[currentUser].removedSpecies[egEditKey])allUsers[currentUser].removedSpecies[egEditKey]=[];const group=getAllGroups().find(g=>g.key===egEditKey);const origSpecies=SPECIES_DATA[egEditKey].species;allUsers[currentUser].removedSpecies[egEditKey].push(origSpecies[index+(SPECIES_DATA[egEditKey].species.length-getAllGroups().find(g=>g.key===egEditKey).species.length)]?.sci||getAllGroups().find(g=>g.key===egEditKey).species[index]?.sci);}else{const rawKey=egEditKey.replace(/^custom_/,'');allUsers[currentUser].customGroups[rawKey].species.splice(index,1);}saveData();buildNav();renderStats();renderGrid();renderEditGroups();}
function egAddSpecies(){const name=document.getElementById('eg-sp-name').value.trim(),sci=document.getElementById('eg-sp-sci').value.trim(),notes=document.getElementById('eg-sp-notes').value.trim(),err=document.getElementById('eg-sp-err');if(!name){err.textContent='Species name is required.';return;}if(!egEditKey.startsWith('custom_')){err.textContent='You can only add species to custom groups.';return;}const rawKey=egEditKey.replace(/^custom_/,'');if(!allUsers[currentUser].customGroups[rawKey].species)allUsers[currentUser].customGroups[rawKey].species=[];allUsers[currentUser].customGroups[rawKey].species.push({name,sci:sci||name,notes});saveData();document.getElementById('eg-sp-name').value='';document.getElementById('eg-sp-sci').value='';document.getElementById('eg-sp-notes').value='';err.textContent='';buildNav();renderStats();renderGrid();renderEditGroups();}

loadData();
</script>
