<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5a7a42">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WildDex — Indiana Wildlife Field Guide</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #f7f2e8; --paper-dark: #ede6d4; --paper-darker: #e0d6c0;
  --ink: #2c2416; --ink-light: #6b5a3e; --ink-faint: #a89878;
  --border: #c8b898; --border-light: #ddd0b8;
  --green: #5a7a42; --green-light: #7a9a5a; --green-pale: #d4e4c0; --green-wash: #eaf2e0;
  --rust: #8b4a2a; --rust-pale: #f0ddd0;
  --blue: #3a5a78; --blue-pale: #d0dde8;
  --purple: #5a3a6a; --purple-pale: #e0d0ea;
  --teal: #2a6a5a; --teal-pale: #c8e4dc;
  --gold: #8a6a1a; --gold-pale: #f0e4c0;
  --shadow: rgba(44,36,22,0.08);
}
body { font-family: 'Source Sans 3', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; background-image: radial-gradient(ellipse at 20% 10%, rgba(90,122,66,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(58,90,120,0.05) 0%, transparent 50%); position: relative; overflow-x: hidden; }
.botanical-corner { position: fixed; pointer-events: none; z-index: 0; opacity: 0.13; }
.botanical-tl { top: 0; left: 0; }
.botanical-br { bottom: 0; right: 0; transform: rotate(180deg); }
.botanical-tr { top: 0; right: 0; transform: scaleX(-1); }
.main-vine-left { position: fixed; left: 0; top: 120px; pointer-events: none; opacity: 0.07; z-index: 0; }
.main-vine-right { position: fixed; right: 0; top: 200px; pointer-events: none; opacity: 0.07; z-index: 0; transform: scaleX(-1); }
.loading-screen { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
.loading-logo { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--green); }
.loading-sub { font-family: 'Lora', serif; font-style: italic; color: var(--ink-faint); font-size: 14px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; position: relative; overflow: hidden; }
.auth-botanical { position: absolute; pointer-events: none; opacity: 0.18; }
.auth-card { background: var(--paper); border: 1.5px solid var(--border); border-radius: 4px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 4px 4px 0 var(--border-light), 0 4px 24px var(--shadow); position: relative; z-index: 1; }
.auth-logo { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--green); text-align: center; margin-bottom: 2px; }
.auth-tagline { text-align: center; font-family: 'Lora', serif; font-style: italic; color: var(--ink-light); font-size: 13px; margin-bottom: 6px; }
.auth-divider { text-align: center; margin-bottom: 1.5rem; color: var(--ink-faint); font-size: 16px; letter-spacing: 6px; }
.auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1.5px solid var(--border); }
.auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1.5px; transition: all 0.2s; }
.auth-tab.active { color: var(--green); border-bottom-color: var(--green); }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 11px; color: var(--ink-light); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; padding: 10px 12px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field textarea:focus { border-color: var(--green); background: #fff; }
.field textarea { resize: vertical; min-height: 100px; }
.btn-primary { width: 100%; padding: 12px; background: var(--green); border: none; border-radius: 3px; color: #fff; font-family: 'Lora', serif; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
.btn-primary:hover { background: var(--green-light); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-error { color: var(--rust); font-size: 13px; margin-top: 0.75rem; text-align: center; font-style: italic; }
.header { background: var(--paper-dark); border-bottom: 1.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 58px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px var(--shadow); overflow: hidden; }
.header-vine { position: absolute; right: 180px; top: 0; opacity: 0.12; pointer-events: none; }
.header-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--green); position: relative; z-index: 1; }
.header-logo span { font-style: italic; font-weight: 400; color: var(--ink-light); font-size: 13px; margin-left: 8px; }
.header-right { display: flex; align-items: center; gap: 1rem; position: relative; z-index: 1; }
.sync-indicator { font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 4px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--rust); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.header-user { font-size: 13px; color: var(--ink-light); font-style: italic; font-family: 'Lora', serif; }
.btn-logout { padding: 6px 14px; background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-light); font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.btn-logout:hover { border-color: var(--green); color: var(--green); }
.nav { background: var(--paper); border-bottom: 1.5px solid var(--border); display: flex; overflow-x: auto; padding: 0 1rem; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-tab { padding: 11px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; margin-bottom: -1.5px; }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
.nav-tab:hover { color: var(--ink-light); }
.main { flex: 1; padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; position: relative; z-index: 1; }
.stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat-card { background: var(--paper); border: 1px solid var(--border); border-radius: 3px; padding: 12px 16px; flex: 1; min-width: 110px; box-shadow: 2px 2px 0 var(--border-light); }
.stat-label { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 600; color: var(--green); font-family: 'Playfair Display', serif; }
.progress-bar { height: 3px; background: var(--paper-darker); border-radius: 2px; margin-top: 6px; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s; }
.controls { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 180px; padding: 9px 14px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: all 0.2s; }
.search-input:focus { border-color: var(--green); background: #fff; }
.filter-btn { padding: 9px 14px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.filter-btn.active { background: var(--green-wash); color: var(--green); border-color: var(--green); }
.edit-groups-btn { padding: 9px 16px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink-light); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.edit-groups-btn:hover { border-color: var(--green); color: var(--green); }
.species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
.species-card { background: var(--paper); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: 2px 2px 0 var(--border-light); }
.species-card:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 3px 4px 0 var(--border); }
.species-card.captured { border-color: var(--green); }
.species-photo { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--paper-dark); position: relative; overflow: hidden; }
.species-photo img { width: 100%; height: 100%; object-fit: cover; }
.species-photo.empty { background: var(--paper-darker); }
.question-mark { font-family: 'Playfair Display', serif; font-size: 48px; color: var(--border); font-style: italic; }
.captured-badge { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
.species-info { padding: 10px 10px 12px; }
.species-num { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; margin-bottom: 2px; }
.species-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 2px; font-family: 'Lora', serif; }
.species-sci { font-size: 10px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; line-height: 1.3; }
.species-habitat { font-size: 10px; color: var(--ink-light); line-height: 1.4; margin-top: 4px; font-family: 'Source Sans 3', sans-serif; }
.species-tag { display: inline-block; margin-top: 6px; padding: 2px 8px; font-size: 10px; border-radius: 2px; }
.tag-snake { background: var(--rust-pale); color: var(--rust); }
.tag-lizard { background: var(--blue-pale); color: var(--blue); }
.tag-turtle { background: var(--teal-pale); color: var(--teal); }
.tag-salamander { background: var(--purple-pale); color: var(--purple); }
.tag-frog { background: var(--green-pale); color: var(--green); }
.tag-toad { background: #e8e0c8; color: #6a5820; }
.tag-bird { background: var(--gold-pale); color: var(--gold); }
.tag-custom { background: var(--paper-darker); color: var(--ink-light); }
.modal-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal { background: var(--paper); border: 1.5px solid var(--border); border-radius: 4px; width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto; box-shadow: 6px 6px 0 var(--border-light), 0 8px 32px var(--shadow); position: relative; }
.modal-vine { position: absolute; top: 0; right: 0; pointer-events: none; opacity: 0.1; }
.modal-header { padding: 1.25rem 1.5rem; border-bottom: 1.5px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; background: var(--paper-dark); position: relative; overflow: hidden; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ink); position: relative; z-index: 1; }
.modal-sci { font-size: 13px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; margin-top: 2px; position: relative; z-index: 1; }
.modal-close { background: none; border: none; color: var(--ink-faint); font-size: 22px; cursor: pointer; line-height: 1; padding: 2px; flex-shrink: 0; transition: color 0.2s; position: relative; z-index: 1; }
.modal-close:hover { color: var(--rust); }
.modal-body { padding: 1.5rem; }
.modal-photo { width: 100%; aspect-ratio: 16/10; background: var(--paper-darker); border-radius: 3px; border: 1px solid var(--border); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.modal-photo img { width: 100%; height: 100%; object-fit: cover; }
.modal-photo.empty { flex-direction: column; gap: 8px; }
.upload-hint { font-size: 13px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; }
.upload-btn { display: block; padding: 10px 20px; background: var(--paper-dark); border: 1.5px dashed var(--border); border-radius: 3px; color: var(--green); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center; width: 100%; margin-bottom: 1rem; }
.upload-btn:hover { background: var(--green-wash); border-color: var(--green); }
input[type=file] { display: none; }
.obs-section { background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 1rem; margin-bottom: 1rem; }
.obs-section-title { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--ink-light); margin-bottom: 0.75rem; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
.obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.obs-field label { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.obs-field input, .obs-field textarea, .obs-field select { width: 100%; padding: 7px 10px; background: var(--paper); border: 1px solid var(--border-light); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
.obs-field input:focus, .obs-field textarea:focus, .obs-field select:focus { border-color: var(--green); }
.obs-field textarea { resize: vertical; min-height: 70px; }
.obs-field select { cursor: pointer; }
.obs-full { grid-column: 1 / -1; }
.btn-save-obs { padding: 8px 18px; background: var(--green); border: none; border-radius: 3px; color: #fff; font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: background 0.2s; }
.btn-save-obs:hover { background: var(--green-light); }
.obs-saved { color: var(--green); font-size: 12px; margin-left: 10px; font-style: italic; font-family: 'Lora', serif; opacity: 0; transition: opacity 0.3s; }
.obs-saved.show { opacity: 1; }
.modal-meta { font-size: 13px; color: var(--ink-light); line-height: 1.7; padding: 10px; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; margin-bottom: 0.75rem; font-family: 'Lora', serif; }
.modal-meta strong { color: var(--ink); font-style: normal; font-family: 'Source Sans 3', sans-serif; }
.modal-habitat { font-size: 13px; color: var(--ink-light); line-height: 1.7; padding: 10px; background: var(--green-wash); border: 1px solid var(--green-pale); border-radius: 3px; margin-bottom: 0.75rem; font-family: 'Lora', serif; font-style: italic; }
.modal-habitat strong { color: var(--green); font-style: normal; font-family: 'Source Sans 3', sans-serif; }
.btn-remove { margin-top: 0.75rem; padding: 7px 14px; background: none; border: 1px solid #c8a898; border-radius: 3px; color: var(--rust); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn-remove:hover { background: var(--rust-pale); }
.status-badge { display: inline-block; margin-left: 8px; padding: 1px 7px; font-size: 10px; border-radius: 2px; vertical-align: middle; font-family: 'Source Sans 3', sans-serif; }
.status-endangered { background: #f0d8d0; color: #8b2a1a; }
.status-threatened { background: #f0e8d0; color: #8a5a10; }
.status-concern { background: #e8ecd8; color: #4a6020; }
.eg-tabs { display: flex; border-bottom: 1.5px solid var(--border); margin-bottom: 1.25rem; }
.eg-tab { flex: 1; padding: 9px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1.5px; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.eg-tab.active { color: var(--green); border-bottom-color: var(--green); }
.group-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.group-row { display: flex; align-items: center; justify-content: space-between; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 10px 14px; gap: 8px; }
.group-row-name { font-size: 14px; color: var(--ink); font-family: 'Lora', serif; }
.group-row-count { font-size: 12px; color: var(--ink-faint); }
.group-row-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.btn-sm { padding: 5px 12px; border-radius: 3px; font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--ink-light); transition: all 0.2s; white-space: nowrap; }
.btn-sm.danger { border-color: #c8a898; color: var(--rust); }
.btn-sm.danger:hover { background: var(--rust-pale); }
.btn-sm.primary { border-color: var(--green); color: var(--green); }
.btn-sm.primary:hover { background: var(--green-wash); }
.btn-sm.warning { border-color: var(--gold); color: var(--gold); }
.btn-sm.warning:hover { background: var(--gold-pale); }
.divider { border: none; border-top: 1px solid var(--border-light); margin: 1rem 0; }
.eg-section-title { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.75rem; }
.species-edit-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; margin-bottom: 1rem; }
.species-edit-row { display: flex; align-items: center; justify-content: space-between; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 8px 12px; gap: 8px; }
.species-edit-name { font-size: 13px; color: var(--ink); font-family: 'Lora', serif; }
.species-edit-sci { font-size: 11px; color: var(--ink-faint); font-style: italic; }
.add-species-row { display: flex; gap: 8px; margin-top: 0.5rem; flex-wrap: wrap; }
.add-species-row input { flex: 1; min-width: 110px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; }
.add-species-row input:focus { border-color: var(--green); }
.btn-add-sp { padding: 8px 14px; background: var(--green-wash); border: 1px solid var(--green); border-radius: 3px; color: var(--green); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; }
.btn-add-sp:hover { background: var(--green-pale); }
.notice { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-top: 6px; font-family: 'Lora', serif; }
.inline-err { color: var(--rust); font-size: 12px; margin-top: 6px; min-height: 18px; font-style: italic; }
.rename-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; }
.rename-row input { flex: 1; padding: 9px 12px; background: var(--paper); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Lora', serif; font-size: 14px; outline: none; }
.rename-row input:focus { border-color: var(--green); }
.btn-rename { padding: 9px 16px; background: var(--green); border: none; border-radius: 3px; color: #fff; font-family: 'Lora', serif; font-size: 13px; cursor: pointer; white-space: nowrap; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--ink-faint); font-size: 15px; font-family: 'Lora', serif; font-style: italic; }
.botanical-divider { text-align: center; padding: 2rem 0 1rem; opacity: 0.25; }
@media (max-width: 500px) {
  .species-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .main { padding: 1rem; } .stats-bar { gap: 8px; } .stat-card { padding: 10px 12px; }
  .obs-grid { grid-template-columns: 1fr; } .modal { max-width: 100%; }
  .header-logo span, .main-vine-left, .main-vine-right { display: none; }
}
</style>
</head>

  {name:"Western Painted Turtle",sci:"Chrysemys picta bellii",notes:"Larger than the Midland subspecies with elaborate red patterning on the plastron. Found in western Indiana.",habitat:"Lakes, ponds, and sluggish rivers in western Indiana; prefers soft-bottomed, well-vegetated waters."},
  {name:"Common Map Turtle",sci:"Graptemys geographica",notes:"Named for the map-like lines on its shell. Females are significantly larger than males. Eats mollusks and crayfish.",habitat:"Medium to large rivers and lakes with abundant basking spots; requires clean water with good aquatic vegetation statewide."},
  {name:"Ouachita Map Turtle",sci:"Graptemys ouachitensis",notes:"Uncommon. Has large yellow spots behind the eye. Males much smaller than females. Eats invertebrates.",habitat:"Large, clear rivers with gravel or sand bottoms in the Wabash and Ohio drainages; requires clean water."},
  {name:"False Map Turtle",sci:"Graptemys pseudogeographica",notes:"Common on larger river systems. Has a small keel on its shell. Basks extensively on logs.",habitat:"Large rivers, oxbow lakes, and backwaters with abundant logs for basking along the Wabash and Ohio rivers."},
  {name:"Hieroglyphic River Cooter",sci:"Pseudemys concinna hieroglyphica",notes:"State Endangered. One of Indiana's largest basking turtles. Yellowish hieroglyph-like markings on a dark shell.",habitat:"Large, clear rivers and lakes with abundant aquatic vegetation; restricted to the Ohio River drainage in Indiana.",status:"endangered"},
  {name:"Red-eared Slider",sci:"Trachemys scripta elegans",notes:"Common basker with a distinctive red stripe behind the eye. Many individuals are released pets. Eats plants and invertebrates.",habitat:"Ponds, lakes, slow rivers, and wetlands statewide; highly adaptable and often the most visible turtle at parks and nature centers."},
  {name:"Midland Smooth Softshell",sci:"Apalone mutica mutica",notes:"Pancake-flat leathery shell and a long snorkel-like snout. Extremely fast in water. Game species.",habitat:"Large, sandy-bottomed rivers with sand bars for basking; found in the Wabash, White, and Ohio river systems."},
  {name:"Eastern Spiny Softshell",sci:"Apalone spinifera spinifera",notes:"Covered in small spiny projections at the front of the shell. Larger than the Smooth Softshell. Game species.",habitat:"Large and medium rivers with sandy or gravelly bottoms statewide; also found in some lakes with sandy areas."},
  {name:"Common Musk Turtle",sci:"Sternotherus odoratus",notes:"Also called the Stinkpot for its pungent musk. Tiny — rarely over 5 inches. Highly aquatic, rarely basks.",habitat:"Shallow ponds, lakes, slow streams, and swamps with muddy bottoms and abundant aquatic vegetation statewide."},
  {name:"Eastern Mud Turtle",sci:"Kinosternon subrubrum",notes:"State Endangered. Small brown turtle with a double-hinged plastron. Often found on land during drought. Very rare in Indiana.",habitat:"Shallow, muddy ponds, ditches, and floodplain pools in southwestern Indiana; uses terrestrial areas during dry periods.",status:"endangered"},
  {name:"Spotted Turtle",sci:"Clemmys guttata",notes:"State Endangered. One of Indiana's most beautiful turtles — tiny with bright yellow spots on a black shell.",habitat:"Sphagnum bogs, sedge meadows, and shallow, weedy ponds in northern Indiana; extremely rare and declining.",status:"endangered"},
  {name:"Blanding's Turtle",sci:"Emydoidea blandingii",notes:"State Endangered. Distinctive bright yellow chin and throat. Semi-hinged plastron. Long-lived — may exceed 70 years.",habitat:"Lake shores, wet meadows, and shallow bogs in northern Indiana; travels widely on land between wetlands.",status:"endangered"},
]},
boxturtles:{label:"Box Turtles",color:"tag-turtle",species:[
  {name:"Eastern Box Turtle",sci:"Terrapene carolina carolina",notes:"State Special Concern. The only fully terrestrial turtle in Indiana. Can completely close its hinged shell. Long-lived — up to 100 years.",habitat:"Moist deciduous forests, woodland edges, and meadows statewide; needs areas with both open sun and dense cover. Highly vulnerable to road mortality."},
  {name:"Ornate Box Turtle",sci:"Terrapene ornata ornata",notes:"State Endangered. Flatter shell with ornate yellow lines. More heat-tolerant than the Eastern Box Turtle.",habitat:"Dry, open sandy prairies and sandy barrens in northwestern Indiana; critically rare and restricted to just a few sites.",status:"endangered"},
  {name:"Wood Turtle",sci:"Glyptemys insculpta",notes:"State Endangered. Beautifully sculpted shell, orange skin on neck and legs. Highly intelligent for a reptile.",habitat:"Along clear, rocky streams and adjacent upland forests and meadows; extremely rare in Indiana, known from only a few northern sites.",status:"endangered"},
]},
salamanders:{label:"Salamanders",color:"tag-salamander",species:[
  {name:"Spotted Salamander",sci:"Ambystoma maculatum",notes:"Large, stocky, with vivid yellow spots on a black background. Secretive. Breeds explosively in vernal pools in early spring.",habitat:"Mature deciduous forest near vernal pools; adults spend most of the year underground but emerge on the first warm rainy nights of February-March."},
  {name:"Jefferson Salamander",sci:"Ambystoma jeffersonianum",notes:"Slender, long-limbed, slate gray. One of Indiana's earliest spring breeders. Often confused with the Blue-spotted Salamander.",habitat:"Upland deciduous forests near fishless vernal pools and woodland ponds; migrates on the first warm rains of late February."},
  {name:"Blue-spotted Salamander",sci:"Ambystoma laterale",notes:"Species of Special Concern. Small, dark blue-black with vivid blue flecking. Breeds in very early spring.",habitat:"Low-lying deciduous forest and forested wetlands in northern Indiana; requires fishless vernal pools for breeding.",status:"concern"},
  {name:"Smallmouth Salamander",sci:"Ambystoma texanum",notes:"Common in southern Indiana. Small head relative to body. Gray with lichen-like lighter markings. Winter and early spring breeder.",habitat:"Floodplain forests, wet lowland woods, and prairies; breeds in shallow flooded areas and ditches, often in mid-winter."},
  {name:"Tiger Salamander",sci:"Ambystoma tigrinum",notes:"Indiana's largest land salamander. Robust, with irregular yellow and brown markings. Uses rodent burrows.",habitat:"Open areas near fishless ponds — prairies, farmland, and sandy barrens; breeds in ponds without fish; adults burrow deeply in uplands."},
  {name:"Marbled Salamander",sci:"Ambystoma opacum",notes:"Distinctive white or silver crossbands on a black body. Indiana's only fall breeder — females guard eggs under leaves.",habitat:"Dry upland forests near seasonal ponds; nests in leaf litter near dry pond basins that fill with fall and winter rains in southern Indiana."},
  {name:"Red-backed Salamander",sci:"Plethodon cinereus",notes:"Indiana's most abundant salamander. Two color phases — red-backed and lead-backed. Lungless; breathes through moist skin. Never enters water.",habitat:"Moist deciduous forest statewide; found under virtually any flat rock or rotting log in appropriate forest; does not need ponds or streams."},
  {name:"Zigzag Salamander",sci:"Plethodon dorsalis",notes:"Slender lungless salamander with a distinctive zigzag stripe down its back. Restricted to southern Indiana.",habitat:"Limestone cliff faces, cave entrances, and rocky ravines in the unglaciated hill country of southern Indiana."},
  {name:"Ravine Salamander",sci:"Plethodon richmondi",notes:"Very slender, long-bodied lungless salamander. Often found in large numbers on hillsides.",habitat:"Moist hillside forests and ravine slopes in southern Indiana; congregates under flat rocks on slopes during mild, moist weather."},
  {name:"Northern Slimy Salamander",sci:"Plethodon glutinosus",notes:"Large lungless salamander with white or gold spots. Produces intensely sticky skin secretions when handled.",habitat:"Moist ravines and rocky hillside forests in southern Indiana; favors shaded slopes under large flat rocks and rotting logs."},
  {name:"Green Salamander",sci:"Aneides aeneus",notes:"State Endangered. The only arboreal salamander in Indiana. Has expanded toe pads for climbing rock faces.",habitat:"Sandstone and limestone cliff outcrops and caves in the forested hills of southern Indiana; lives in narrow crevices in cliff faces.",status:"endangered"},
  {name:"Northern Dusky Salamander",sci:"Desmognathus fuscus",notes:"Common stream-dweller. Brown with a lighter diagonal stripe from eye to jaw. Stocky with a keeled tail.",habitat:"Along rocky, springfed streams and seeps in southern Indiana; found under rocks in and immediately beside flowing water."},
  {name:"Cave Salamander",sci:"Eurycea lucifuga",notes:"Vivid orange-red with black spots. Lives in twilight zones of caves and damp rocky cliff faces.",habitat:"Cave entrances, limestone cliff overhangs, and springfed rocky streams in Indiana's karst country; often visible at cave mouths."},
  {name:"Long-tailed Salamander",sci:"Eurycea longicauda",notes:"Long tail (over half total length), yellow with black spots. Active and quick. Found near springs.",habitat:"Rocky springs, seeps, and stream banks in southern Indiana; often ventures far from water under cover objects."},
  {name:"Northern Two-lined Salamander",sci:"Eurycea bislineata",notes:"Slender yellow salamander with two dark stripes running down its back. Common in rocky streams.",habitat:"Rocky, spring-fed streams and seeps in southern Indiana; found under rocks in and beside clear, cold running water."},
  {name:"Spring Salamander",sci:"Gyrinophilus porphyriticus",notes:"Large (up to 8 inches), salmon-pink or reddish with a distinct light line from eye to nostril. Eats other salamanders.",habitat:"Cold, clear, springfed streams and cave streams in southern Indiana's hill country; requires very high water quality."},
  {name:"Mudpuppy",sci:"Necturus maculosus",notes:"Permanently aquatic, never metamorphoses. Retains bushy red external gills throughout its life. Up to 14 inches.",habitat:"Lakes, large rivers, and streams statewide; prefers deep water with rocky or sandy bottoms; most active at night and under ice in winter."},
  {name:"Red-spotted Newt",sci:"Notophthalmus viridescens",notes:"Has three distinct life stages. The bright red 'eft' stage lives on land for 1-3 years before returning to water.",habitat:"Woodland ponds and streams during aquatic stages; juvenile efts wander through moist forest floors of eastern and southern Indiana."},
  {name:"Hellbender",sci:"Cryptobranchus alleganiensis",notes:"State Endangered. North America's largest salamander — up to 25 inches. Breathes through wrinkled skin folds. Completely aquatic.",habitat:"Large, clear, fast-flowing rivers with massive flat rocks; extreme southern Indiana streams feeding into the Ohio River; very rare.",status:"endangered"},
  {name:"Western Lesser Siren",sci:"Siren intermedia nettingi",notes:"Eel-like, with only two small front legs and no hind legs. Gills persist throughout life. Buries in mud during drought.",habitat:"Shallow, muddy, heavily vegetated ponds, ditches, sloughs, and backwaters in southwestern Indiana; highly secretive."},
]},
frogs:{label:"Frogs",color:"tag-frog",species:[
  {name:"American Bullfrog",sci:"Lithobates catesbeianus",notes:"Indiana's largest frog — up to 7 inches. Deep jug-o-rum call. Eats almost anything it can swallow. Game species.",habitat:"Permanent ponds, lakes, slow rivers, and marshes with emergent vegetation; requires permanent water as tadpoles take 1-2 years to transform."},
  {name:"Green Frog",sci:"Lithobates clamitans",notes:"Common pond frog with a distinctive twangy banjo-string call. Males have a large yellow throat. Has a prominent dorsolateral ridge.",habitat:"Permanent ponds, streams, lakes, and swamps statewide; almost always within a few feet of water."},
  {name:"Northern Leopard Frog",sci:"Lithobates pipiens",notes:"Classic spotted frog with two rows of rounded dark spots outlined in white. Snoring call. Wanders widely from water in summer.",habitat:"Wet meadows, marshes, and grassy areas near ponds and streams; more terrestrial in summer than most frogs."},
  {name:"Southern Leopard Frog",sci:"Lithobates sphenocephalus",notes:"Similar to Northern Leopard Frog but with a more pointed snout and spots less regularly arranged. Chuckling call.",habitat:"Shallow, weedy ponds, swamps, and flooded fields in southern Indiana; more wetland-dependent than its northern cousin."},
  {name:"Pickerel Frog",sci:"Lithobates palustris",notes:"Distinctive two parallel rows of square dark spots. Produces mild toxic skin secretions that deter many predators.",habitat:"Cold, clear springs, rocky streams, and boggy areas; often found in caves in summer; prefers clean, cool water."},
  {name:"Wood Frog",sci:"Lithobates sylvaticus",notes:"Distinctive 'robber's mask'. Freezes solid in winter — heart stops completely. Among the first frogs to breed.",habitat:"Moist deciduous forest floor; breeds in woodland vernal pools during late February to March, then disperses into surrounding forest."},
  {name:"Crawfish Frog",sci:"Lithobates areolatus",notes:"State Endangered. Uses crayfish burrows as permanent retreats. Has a distinctive deep, snoring call. Rarely seen far from burrows.",habitat:"Open grasslands and wet prairies with abundant crayfish burrows; very rare in Indiana, restricted to a few southwestern sites.",status:"endangered"},
  {name:"Cricket Frog",sci:"Acris crepitans",notes:"Tiny, rough-skinned frog with a distinctive triangular mark on its head. Call sounds like two pebbles clicked together.",habitat:"Sunny, open edges of ponds, streams, and marshes; needs bare mudflats or short grass along water's edge; common in central and southern Indiana."},
  {name:"Spring Peeper",sci:"Pseudacris crucifer",notes:"Tiny frog with a distinctive X-mark on its back. One of Indiana's loudest voices relative to body size. Calls from late February.",habitat:"Woodland edges and shrubby wetlands near vernal pools; breeds in small woodland ponds and flooded areas in early spring statewide."},
  {name:"Western Chorus Frog",sci:"Pseudacris triseriata",notes:"Tiny, with three dark stripes down its back. Finger-dragged-across-a-comb call. Very early breeder.",habitat:"Open grassy areas, wet meadows, and shrub-scrub wetlands; breeds in temporary pools and roadside ditches in early spring statewide."},
  {name:"Boreal Chorus Frog",sci:"Pseudacris maculata",notes:"Nearly identical to Western Chorus Frog. Stripes often broken into spots. Replaces Western Chorus Frog in northern Indiana.",habitat:"Wet meadows, grassy marshes, and shallow ponds in northern Indiana; often breeds in roadside ditches and flooded fields."},
  {name:"Mountain Chorus Frog",sci:"Pseudacris brachyphona",notes:"Uncommon. Stripes often form a reverse parentheses pattern on the back. Raspy, rapidly repeated call.",habitat:"Hillside pools and small ponds in hilly terrain of southern Indiana; breeds in ephemeral pools on forested slopes."},
  {name:"Gray Treefrog",sci:"Hyla versicolor",notes:"Rough-textured, color-changing treefrog. Loud, musical trill. Concealed orange-yellow on inner thigh visible in flight.",habitat:"Forested areas near woodland ponds and swamps; breeds in small wooded ponds in May-June; spends most time high in trees."},
  {name:"Cope's Gray Treefrog",sci:"Hyla chrysoscelis",notes:"Visually identical to Gray Treefrog. Diploid (Gray Treefrog is tetraploid). Distinguished by faster trill call.",habitat:"Similar to Gray Treefrog — forested areas and woodland edges near ponds; often breeds slightly earlier in the season."},
  {name:"Green Treefrog",sci:"Hyla cinerea",notes:"Uncommon in Indiana — at the northern edge of its range. Vivid green with a white lateral stripe. Bell-like 'queenk' call.",habitat:"Swampy areas with cypress-like vegetation, cattail marshes, and large pond edges in extreme southwestern Indiana.",status:"concern"},
  {name:"Bird-voiced Treefrog",sci:"Hyla avivoca",notes:"Rare in Indiana. Bird-like call. Smaller than Gray Treefrog. Has yellow-green (not orange) coloring on hidden thigh surfaces.",habitat:"Cypress swamps, flooded bottomland forest, and swampy backwaters in extreme southwestern Indiana; very localized.",status:"concern"},
  {name:"Northern Leopard Frog",sci:"Lithobates pipiens",notes:"Classic spotted frog with two rows of rounded dark spots. Snoring call. Wanders into meadows and fields in summer.",habitat:"Wet meadows, pond edges, and grassy areas near water; more terrestrial than most frogs; prefers lush, grassy wetland margins."},
  {name:"Plains Leopard Frog",sci:"Lithobates blairi",notes:"Uncommon. Very similar to Northern Leopard Frog but with a chuckling call, light spot on tympanum, and dorsal spots less well-defined.",habitat:"Open, grassy areas near ponds and slow streams in western Indiana; more tolerant of drier conditions than other leopard frogs."},
]},
toads:{label:"Toads",color:"tag-toad",species:[
  {name:"American Toad",sci:"Anaxyrus americanus",notes:"Indiana's most common toad. Long, musical trill call lasting 20-30 seconds. Warts secrete mild toxins. Eats vast numbers of insects.",habitat:"Extremely adaptable — found in forests, meadows, gardens, and farmland statewide; breeds in virtually any shallow pond, ditch, or flooded area."},
  {name:"Fowler's Toad",sci:"Anaxyrus fowleri",notes:"Similar to American Toad but with 3+ warts per dark spot, no chest spots, and a harsh, nasal 'waaah' call.",habitat:"Sandy soils, river floodplains, and sandy lakeshore habitats; breeds in shallow, warm ponds and slow streams; more sand-associated than American Toad."},
  {name:"Eastern Spadefoot",sci:"Scaphiopus holbrookii",notes:"Not a true toad despite warty skin. Vertical pupils. Spade-like tubercle on hind foot for burrowing. Explosive breeder after heavy rains.",habitat:"Sandy or loose-soiled uplands, forest clearings, and agricultural fields; breeds explosively in temporary rain pools after heavy summer storms; uncommon in Indiana.",status:"concern"},
]},
birds:{label:"Birds",color:"tag-bird",species:[
  {name:"American Robin",sci:"Turdus migratorius",notes:"Year-round resident. State's most recognizable thrush. Orange-red breast, yellow bill. Pulls earthworms from lawns.",habitat:"Lawns, parks, open woodlands, forest edges, and suburban neighborhoods statewide; nests in trees and on structures."},
  {name:"Northern Cardinal",sci:"Cardinalis cardinalis",notes:"Year-round. Brilliant red male; buffy-brown female with red tinges. Both sexes sing. Indiana's state bird.",habitat:"Forest edges, shrubby areas, thickets, gardens, and suburban feeders statewide; requires dense shrubs for nesting."},
  {name:"Blue Jay",sci:"Cyanocitta cristata",notes:"Year-round. Bold, loud, and intelligent. Blue, white, and black plumage. Caches acorns. Important seed disperser.",habitat:"Oak forests, mixed woodlands, parks, and suburban areas statewide; closely associated with oak trees."},
  {name:"Black-capped Chickadee",sci:"Poecile atricapillus",notes:"Year-round in northern Indiana. Black cap and bib, white cheeks. Fearless at feeders. Caches food for winter.",habitat:"Deciduous and mixed forests, forest edges, and wooded suburbs in the northern half of Indiana; uses nest boxes."},
  {name:"Carolina Chickadee",sci:"Poecile carolinensis",notes:"Year-round in southern Indiana. Nearly identical to Black-capped Chickadee; distinguished by faster chick-a-dee call.",habitat:"Deciduous forests, forest edges, and wooded suburbs in the southern half of Indiana; the two chickadee species hybridize in central Indiana."},
  {name:"Tufted Titmouse",sci:"Baeolophus bicolor",notes:"Year-round. Perky gray crest. Bold, inquisitive. Loud peter-peter-peter song. Caches seeds.",habitat:"Deciduous forests, forest edges, parks, and suburban feeders statewide; nests in tree cavities and nest boxes."},
  {name:"White-breasted Nuthatch",sci:"Sitta carolinensis",notes:"Year-round. Creeps headfirst down tree trunks — unique among Indiana birds. Nasal yank-yank call.",habitat:"Mature deciduous and mixed forests statewide; closely associated with large-diameter trees."},
  {name:"Downy Woodpecker",sci:"Picoides pubescens",notes:"Year-round. Indiana's smallest woodpecker. Black and white. Males have a red nape patch. Common at suet feeders.",habitat:"Deciduous forests, orchards, parks, and suburban areas statewide; uses smaller trees and shrubs more than other woodpeckers."},
  {name:"Hairy Woodpecker",sci:"Leuconotopicus villosus",notes:"Year-round. Larger than Downy with a proportionally longer bill. Less common at feeders. Excavates deeper in wood.",habitat:"Mature deciduous and mixed forests statewide; requires larger trees than Downy Woodpecker."},
  {name:"Red-bellied Woodpecker",sci:"Melanerpes carolinus",notes:"Year-round. Barred black and white back, red cap. Loud churr call. Increasingly common in Indiana.",habitat:"Mature deciduous forests, forest edges, parks, and suburban areas statewide; nests in dead snags."},
  {name:"Pileated Woodpecker",sci:"Dryocopus pileatus",notes:"Year-round. Crow-sized with a flaming red crest. Excavates large rectangular cavities in dead trees.",habitat:"Mature deciduous and mixed forests with large dead trees; uncommon but increasing statewide as forests mature."},
  {name:"Northern Flicker",sci:"Colaptes auratus",notes:"Year-round. Brownish woodpecker with spotted breast. Often forages on the ground for ants. Yellow wing lining in flight.",habitat:"Open woodlands, forest edges, parks, orchards, and suburban areas statewide; nests in tree cavities."},
  {name:"American Crow",sci:"Corvus brachyrhynchos",notes:"Year-round. Highly intelligent. All-black. Forms massive communal roosts in winter — sometimes hundreds of thousands.",habitat:"Extremely adaptable — open fields, forest edges, agricultural land, and urban areas statewide."},
  {name:"Eastern Bluebird",sci:"Sialia sialis",notes:"Year-round. Brilliant blue above, rust-orange breast. Cavity nester that has recovered strongly thanks to nest box programs.",habitat:"Open fields, meadows, and pastures with scattered trees or fence posts; uses nest boxes readily."},
  {name:"American Goldfinch",sci:"Spinus tristis",notes:"Year-round. Males bright yellow in summer, olive-green in winter. Strict vegetarian. Late nester — waits for thistle seeds.",habitat:"Open fields, meadows, roadsides, and gardens with thistle and sunflowers; common at nyjer feeders statewide."},
  {name:"House Finch",sci:"Haemorhous mexicanus",notes:"Year-round. Males with red-washed head and breast. Originally western; introduced to East and now abundant.",habitat:"Urban and suburban areas, parks, farms, and forest edges; readily nests on structures and in evergreens."},
  {name:"Purple Finch",sci:"Haemorhous purpureus",notes:"Winter visitor. Males raspberry-red (not purple). Visits feeders. Often overlooked among House Finches.",habitat:"Mature forests and forest edges during migration and winter; visits sunflower feeders in wooded suburban areas."},
  {name:"Dark-eyed Junco",sci:"Junco hyemalis",notes:"Winter visitor. Slate-gray with white outer tail feathers that flash in flight. 'Snowbird' — arrives with cold weather.",habitat:"Forest edges, brushy areas, and suburban feeders statewide in winter; nests in Canada and returns in October."},
  {name:"White-throated Sparrow",sci:"Zonotrichia albicollis",notes:"Common winter visitor. White throat patch, yellow lores. Old-Sam-Peabody-Peabody-Peabody song.",habitat:"Forest undergrowth, brushy fields, and shrubby thickets in winter; common at ground-level feeders."},
  {name:"Song Sparrow",sci:"Melospiza melodia",notes:"Year-round. Heavy breast streaking with a central breast spot. Complex, varied song. Among Indiana's most common sparrows.",habitat:"Brushy field edges, marshes, stream banks, and weedy areas statewide; very adaptable."},
  {name:"Field Sparrow",sci:"Spizella pusilla",notes:"Summer breeder. Pink bill, rusty cap, plain face with a bold eye ring. Accelerating bouncing ball trill.",habitat:"Shrubby old fields, brushy pastures, and overgrown meadows; declining as farmland is lost or reverts to closed-canopy forest."},
  {name:"Chipping Sparrow",sci:"Spizella passerina",notes:"Summer breeder. Rusty cap, white supercilium, black eye line. Common in suburban areas. Dry mechanical trill.",habitat:"Suburban lawns, open pine plantations, parks, and forest edges statewide; often nests in ornamental evergreens."},
  {name:"House Sparrow",sci:"Passer domesticus",notes:"Year-round non-native. Introduced from Europe in 1850s. Males have black bib and chestnut nape. Aggressively outcompetes native cavity nesters.",habitat:"Urban and suburban areas, farms, and grain elevators statewide; almost entirely associated with human structures."},
  {name:"European Starling",sci:"Sturnus vulgaris",notes:"Year-round non-native. Introduced in 1890. Iridescent black in spring, speckled in fall. Forms enormous murmurations.",habitat:"Urban areas, farms, open fields, and woodlands statewide; nests in any available cavity."},
  {name:"Red-winged Blackbird",sci:"Agelaius phoeniceus",notes:"Summer breeder, some winter. Males with vivid red and yellow shoulder patches. Abundant marsh bird.",habitat:"Cattail marshes, wet meadows, and lake edges statewide; one of Indiana's most abundant nesting birds."},
  {name:"Common Grackle",sci:"Quiscalus quiscula",notes:"Year-round. Iridescent black, long keel-shaped tail, yellow eye. Forages in large mixed flocks.",habitat:"Open woodlands, agricultural fields, parks, and suburban areas statewide; nests colonially in dense conifers."},
  {name:"Brown-headed Cowbird",sci:"Molothrus ater",notes:"Year-round. Brood parasite — lays eggs in other birds' nests. Males glossy black with brown head.",habitat:"Forest edges, farms, and open woodland; historically followed bison herds; now associated with fragmented forest landscapes."},
  {name:"Baltimore Oriole",sci:"Icterus galbula",notes:"Summer breeder. Brilliant flame-orange and black male. Weaves distinctive hanging basket nest. Eats insects, nectar, and fruit.",habitat:"Open woodlands, riparian corridors, parks, and suburban areas with tall deciduous trees; attracted to orange halves and grape jelly."},
  {name:"Orchard Oriole",sci:"Icterus spurius",notes:"Summer breeder. Males brick-red and black — not orange. Smallest North American oriole. Eats insects and nectar.",habitat:"Open woodlands, riparian areas, orchards, and rural towns; often nests in pecan and other orchard trees."},
  {name:"Eastern Meadowlark",sci:"Sturnella magna",notes:"Year-round, declining. Bright yellow breast with black V-necklace. Beloved farm country song bird. Grassland obligate.",habitat:"Open grasslands, hay fields, and pastures; severely declining as grassland habitats are lost across Indiana."},
  {name:"Ruby-throated Hummingbird",sci:"Archilochus colubris",notes:"Summer only. Indiana's only breeding hummingbird. Males with iridescent ruby throat. Beats wings 53 times per second.",habitat:"Forest edges, gardens with tubular flowers, and woodland clearings; readily visits nectar feeders May-September."},
  {name:"Chimney Swift",sci:"Chaetura pelagica",notes:"Summer. 'Flying cigar.' Chatters continuously while foraging high overhead. Nests colonially in chimneys.",habitat:"Aerial — forages over towns, cities, and open country statewide; roosts and nests in chimneys and hollow trees."},
  {name:"Barn Swallow",sci:"Hirundo rustica",notes:"Summer. Deeply forked tail. Steely blue above, rusty-orange below. Nests on human structures.",habitat:"Open areas near water — farms, bridges, and rural buildings statewide; forages low over fields and water."},
  {name:"Tree Swallow",sci:"Tachycineta bicolor",notes:"Summer breeder. Iridescent blue-green above, brilliant white below. One of the first swallows to arrive in spring.",habitat:"Open areas near lakes, rivers, and wetlands; uses nest boxes and natural tree cavities near water."},
  {name:"Purple Martin",sci:"Progne subis",notes:"Summer. Largest swallow. Males entirely dark purple-black. Entirely dependent on human-provided martin houses in eastern North America.",habitat:"Open country near water — farms, lake shores, and towns; nests exclusively in martin houses and gourds in Indiana."},
  {name:"Eastern Kingbird",sci:"Tyrannus tyrannus",notes:"Summer. Black and white flycatcher with white tail tip. Aggressively defends territory, attacking hawks and crows.",habitat:"Forest edges, roadsides, orchards, and open country near water; perches conspicuously on fence posts and wires."},
  {name:"Great Crested Flycatcher",sci:"Myiarchus crinitus",notes:"Summer. Loud wheep call from forest canopy. Rusty tail and yellow belly. Often uses shed snakeskin in nest.",habitat:"Mature deciduous forest interior statewide; nests in tree cavities in closed-canopy forest."},
  {name:"Eastern Phoebe",sci:"Sayornis phoebe",notes:"Early spring migrant and summer breeder. Tail-pumping habit. Nests on bridges and buildings near water.",habitat:"Wooded areas near streams, bridges, and cliffs; one of the first insectivorous migrants to return in March."},
  {name:"Eastern Wood-Pewee",sci:"Contopus virens",notes:"Summer. Plaintive pee-a-wee call heard throughout summer forest. Difficult to see in forest canopy.",habitat:"Mature deciduous forest interior and edges statewide; forages from mid-story perches."},
  {name:"Acadian Flycatcher",sci:"Empidonax virescens",notes:"Summer. Difficult to identify without its explosive peet-sa call. Nests in ravines and beech-maple forest.",habitat:"Moist beech-maple and mixed ravine forests, especially along shaded stream corridors in southern and central Indiana."},
  {name:"Red-eyed Vireo",sci:"Vireo olivaceus",notes:"Summer. Indiana's most persistent singer — sings continuously through the heat of the day. Red eye visible at close range.",habitat:"Mature deciduous forest canopy statewide; one of Indiana's most abundant forest breeding birds."},
  {name:"Cedar Waxwing",sci:"Bombycilla cedrorum",notes:"Year-round. Sleek, crested, with red waxy wingtip droplets. Wanders in flocks following fruit. High-pitched trilled call.",habitat:"Forest edges, orchards, and areas with fruiting trees; follows berry crops — cedar, cherry, and crabapple statewide."},

let groupLabels={};
let currentUser=null,userId=null,currentGroup='snakes',currentFilter='all',currentSpecies=null,authMode='login',egMode='manage',egEditKey=null;
let photos={},observations={},customGroups={},removedSpecies={};

function setSyncing(){document.getElementById('sync-dot').className='sync-dot syncing';document.getElementById('sync-label').textContent='Syncing...';}
function setSynced(){document.getElementById('sync-dot').className='sync-dot';document.getElementById('sync-label').textContent='Synced';}
function setSyncError(){document.getElementById('sync-dot').className='sync-dot error';document.getElementById('sync-label').textContent='Offline';}

function switchAuthTab(m){authMode=m;document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&m==='login')||(i===1&&m==='register')));document.getElementById('auth-error').textContent='';document.getElementById('auth-btn').textContent=m==='login'?'Sign In':'Create Account';}

async function handleAuth(){
  const u=document.getElementById('auth-username').value.trim(),p=document.getElementById('auth-password').value,err=document.getElementById('auth-error'),btn=document.getElementById('auth-btn');
  if(!u||!p){err.textContent='Please fill in all fields.';return;}
  if(p.length<4){err.textContent='Password must be at least 4 characters.';return;}
  btn.disabled=true;btn.textContent='Please wait...';
  try{
    if(authMode==='register'){
      const{data:ex}=await sb.from('users').select('id').eq('username',u).single();
      if(ex){err.textContent='Username already taken.';btn.disabled=false;btn.textContent='Create Account';return;}
      const{data,error}=await sb.from('users').insert({username:u,password:p}).select().single();
      if(error)throw error;
      userId=data.id;currentUser=u;
    }else{
      const{data,error}=await sb.from('users').select('*').eq('username',u).eq('password',p).single();
      if(error||!data){err.textContent='Invalid username or password.';btn.disabled=false;btn.textContent='Sign In';return;}
      userId=data.id;currentUser=u;
    }
    await loadAllData();
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('main-app').style.display='flex';
    document.getElementById('header-user').textContent=u;
    buildNav();renderStats();renderGrid();
  }catch(e){err.textContent='Connection error. Please try again.';btn.disabled=false;btn.textContent=authMode==='login'?'Sign In':'Create Account';}
}

async function logout(){
  currentUser=null;userId=null;photos={};observations={};customGroups={};removedSpecies={};groupLabels={};
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('main-app').style.display='none';
  document.getElementById('auth-username').value='';document.getElementById('auth-password').value='';
  document.getElementById('auth-btn').disabled=false;document.getElementById('auth-btn').textContent='Sign In';
}

async function loadAllData(){
  setSyncing();
  try{
    const[ph,obs,cg,rs,gl]=await Promise.all([
      sb.from('photos').select('*').eq('user_id',userId),
      sb.from('observations').select('*').eq('user_id',userId),
      sb.from('custom_groups').select('*').eq('user_id',userId),
      sb.from('removed_species').select('*').eq('user_id',userId),
      sb.from('group_labels').select('*').eq('user_id',userId)
    ]);
    photos={};(ph.data||[]).forEach(r=>photos[r.species_key]=r.photo_data);
    observations={};(obs.data||[]).forEach(r=>observations[r.species_key]={date:r.obs_date,time:r.obs_time,location:r.location,weather:r.weather,behavior:r.behavior,details:r.details,notes:r.notes});
    customGroups={};(cg.data||[]).forEach(r=>customGroups[r.group_name]=r.species_data||[]);
    removedSpecies={};(rs.data||[]).forEach(r=>{if(!removedSpecies[r.group_key])removedSpecies[r.group_key]=[];removedSpecies[r.group_key].push(r.sci_name);});
    groupLabels={};(gl.data||[]).forEach(r=>groupLabels[r.group_key]=r.label);
    setSynced();
  }catch(e){setSyncError();}
}

function getGroupLabel(key){return groupLabels[key]||(SPECIES_DATA[key]?SPECIES_DATA[key].label:key.replace('custom_',''));}

function getAllGroups(){
  const rem=allUsers_removedSpecies();
  const built=Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,label:getGroupLabel(k),color:v.color,builtin:true,species:v.species.filter(s=>!(removedSpecies[k]||[]).includes(s.sci))}));
  const custom=Object.entries(customGroups).map(([k,v])=>({key:'custom_'+k,label:getGroupLabel('custom_'+k)||k,color:'tag-custom',builtin:false,species:Array.isArray(v)?v:[]}));
  return[...built,...custom];
}
function allUsers_removedSpecies(){return removedSpecies;}

function buildNav(){const nav=document.getElementById('nav-tabs');nav.innerHTML='';getAllGroups().forEach(g=>{const b=document.createElement('button');b.className='nav-tab'+(g.key===currentGroup?' active':'');b.textContent=g.label;b.onclick=()=>{currentGroup=g.key;currentFilter='all';document.getElementById('search-input').value='';buildNav();renderStats();renderGrid();};nav.appendChild(b);});}
function getCurrentGroupData(){return getAllGroups().find(g=>g.key===currentGroup)||getAllGroups()[0];}
function renderStats(){const g=getCurrentGroupData(),total=g.species.length,cap=g.species.filter(s=>photos[currentGroup+'_'+s.sci]).length,pct=total>0?Math.round(cap/total*100):0;document.getElementById('stats-bar').innerHTML=`<div class="stat-card"><div class="stat-label">${g.label} photographed</div><div class="stat-value">${cap} / ${total}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="stat-card"><div class="stat-label">Completion</div><div class="stat-value">${pct}%</div></div><div class="stat-card"><div class="stat-label">Still needed</div><div class="stat-value">${total-cap}</div></div>`;}
function setFilter(f){currentFilter=f;['all','captured','missing'].forEach(x=>document.getElementById('filter-'+x).classList.toggle('active',x===f));renderGrid();}

function renderGrid(){
  const g=getCurrentGroupData(),search=document.getElementById('search-input').value.toLowerCase();
  let sp=g.species.filter(s=>{
    const has=!!photos[currentGroup+'_'+s.sci];
    if(currentFilter==='captured'&&!has)return false;
    if(currentFilter==='missing'&&has)return false;
    if(search&&!s.name.toLowerCase().includes(search)&&!s.sci.toLowerCase().includes(search))return false;
    return true;
  });
  const grid=document.getElementById('species-grid');
  if(!sp.length){grid.innerHTML='<div class="empty-state">No species match your filters.</div>';return;}
  grid.innerHTML=sp.map(s=>{
    const key=currentGroup+'_'+s.sci,photo=photos[key],num=String(g.species.indexOf(s)+1).padStart(3,'0');
    const statusDot=s.status==='endangered'?'🔴 ':s.status==='threatened'?'🟠 ':s.status==='concern'?'🟡 ':'';
    return`<div class="species-card ${photo?'captured':''}" onclick="openSpecies('${currentGroup}','${s.sci.replace(/'/g,"\\'")}')">
      <div class="species-photo ${photo?'':'empty'}">${photo?`<img src="${photo}" alt="${s.name}">`:'<div class="question-mark">?</div>'}${photo?'<div class="captured-badge">✓</div>':''}</div>
      <div class="species-info">
        <div class="species-num">#${num}</div>
        <div class="species-name">${statusDot}${s.name}</div>
        <div class="species-sci">${s.sci}</div>
        ${s.habitat?`<div class="species-habitat">${s.habitat.substring(0,60)}${s.habitat.length>60?'…':''}</div>`:''}
        <span class="species-tag ${g.color}">${g.label}</span>
      </div>
    </div>`;
  }).join('');
}

function openSpecies(groupKey,sci){
  const group=getAllGroups().find(g=>g.key===groupKey),s=group?.species.find(sp=>sp.sci===sci);
  if(!s)return;currentSpecies={groupKey,sci};
  const key=groupKey+'_'+sci,photo=photos[key],od=observations[key]||{};
  document.getElementById('modal-name').textContent=s.name;
  document.getElementById('modal-sci').textContent=s.sci;
  const wrap=document.getElementById('modal-photo-wrap');
  if(photo){wrap.className='modal-photo';wrap.innerHTML=`<img src="${photo}" alt="${s.name}">`;}
  else{wrap.className='modal-photo empty';wrap.innerHTML='<div class="question-mark" style="font-size:56px">?</div><div class="upload-hint">No photo yet</div>';}
  document.getElementById('modal-remove-btn').innerHTML=photo?'<button class="btn-remove" onclick="removePhoto()">Remove photo</button>':'';
  const hab=document.getElementById('modal-habitat');
  if(s.habitat){hab.style.display='block';hab.innerHTML=`<strong>🌿 Where to find it:</strong> ${s.habitat}`;}
  else{hab.style.display='none';}
  document.getElementById('obs-date').value=od.date||'';
  document.getElementById('obs-time').value=od.time||'';
  document.getElementById('obs-location').value=od.location||'';
  document.getElementById('obs-weather').value=od.weather||'';
  document.getElementById('obs-behavior').value=od.behavior||'';
  document.getElementById('obs-details').value=od.details||'';
  document.getElementById('obs-notes').value=od.notes||'';
  document.getElementById('obs-saved-msg').classList.remove('show');
  const statusText=s.status==='endangered'?' · 🔴 State/Federally Endangered':s.status==='threatened'?' · 🟠 Federally Threatened':s.status==='concern'?' · 🟡 Species of Special Concern':'';
  document.getElementById('modal-meta').innerHTML=`<strong>Field notes:</strong> ${s.notes||'No notes available.'}${statusText}`;
  document.getElementById('species-modal').style.display='flex';
}

function closeSpeciesModal(){document.getElementById('species-modal').style.display='none';document.getElementById('file-input').value='';currentSpecies=null;}
function closeModal(e){if(e.target.classList.contains('modal-overlay')){document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none');currentSpecies=null;document.getElementById('file-input').value='';}}
function handleUpload(event){const file=event.target.files[0];if(!file||!currentSpecies)return;const reader=new FileReader();reader.onload=async e=>{const key=currentSpecies.groupKey+'_'+currentSpecies.sci,data=e.target.result;setSyncing();try{await sb.from('photos').upsert({user_id:userId,species_key:key,photo_data:data,updated_at:new Date().toISOString()},{onConflict:'user_id,species_key'});photos[key]=data;setSynced();}catch(err){setSyncError();}openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();};reader.readAsDataURL(file);}
async function removePhoto(){if(!currentSpecies)return;const key=currentSpecies.groupKey+'_'+currentSpecies.sci;setSyncing();try{await sb.from('photos').delete().eq('user_id',userId).eq('species_key',key);delete photos[key];setSynced();}catch(e){setSyncError();}openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();}
async function saveObs(){if(!currentSpecies)return;const key=currentSpecies.groupKey+'_'+currentSpecies.sci;const od={obs_date:document.getElementById('obs-date').value,obs_time:document.getElementById('obs-time').value,location:document.getElementById('obs-location').value,weather:document.getElementById('obs-weather').value,behavior:document.getElementById('obs-behavior').value,details:document.getElementById('obs-details').value,notes:document.getElementById('obs-notes').value};setSyncing();try{await sb.from('observations').upsert({user_id:userId,species_key:key,...od,updated_at:new Date().toISOString()},{onConflict:'user_id,species_key'});observations[key]={date:od.obs_date,time:od.obs_time,location:od.location,weather:od.weather,behavior:od.behavior,details:od.details,notes:od.notes};setSynced();const msg=document.getElementById('obs-saved-msg');msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);}catch(e){setSyncError();}}

function showEditGroups(){egMode='manage';egEditKey=null;renderEditGroups();document.getElementById('editgroups-modal').style.display='flex';}
function renderEditGroups(){
  const body=document.getElementById('editgroups-body');
  const allG=[...Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,rawKey:k,label:getGroupLabel(k),builtin:true,count:getAllGroups().find(g=>g.key===k)?.species.length??v.species.length})),...Object.entries(customGroups).map(([k,v])=>({key:'custom_'+k,rawKey:k,label:getGroupLabel('custom_'+k)||k,builtin:false,count:(Array.isArray(v)?v:[]).length}))];
  if(egMode==='manage'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab active">Manage groups</button><button class="eg-tab" onclick="egMode='add';renderEditGroups()">+ Add new group</button></div><div class="group-list">${allG.map(g=>`<div class="group-row"><div><div class="group-row-name">${g.label}</div><div class="group-row-count">${g.count} species${g.builtin?' · built-in':''}</div></div><div class="group-row-actions"><button class="btn-sm warning" onclick="egRename('${g.key}')">Rename</button><button class="btn-sm primary" onclick="egEdit('${g.key}')">Edit species</button>${!g.builtin?`<button class="btn-sm danger" onclick="egDeleteGroup('${g.rawKey}')">Delete</button>`:''}</div></div>`).join('')}</div>`;}
  else if(egMode==='rename'){const current=getGroupLabel(egEditKey);body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Rename group</button></div><p style="font-size:13px;color:var(--ink-faint);font-family:'Lora',serif;font-style:italic;margin-bottom:1rem;">Current name: <strong style="color:var(--ink)">${current}</strong></p><div class="rename-row"><input type="text" id="eg-rename-input" value="${current}" placeholder="New group name"><button class="btn-rename" onclick="egSaveRename()">Save</button></div><div class="inline-err" id="eg-rename-err"></div>`;setTimeout(()=>{const inp=document.getElementById('eg-rename-input');if(inp){inp.focus();inp.select();}},50);}
  else if(egMode==='add'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Add new group</button></div><div class="field"><label>Group name</label><input type="text" id="eg-new-name" placeholder="e.g. Dragonflies, Mammals..."></div><div class="field"><label>Species — one per line</label><textarea id="eg-new-species" placeholder="Common Name | Scientific Name | Notes&#10;Eastern Darner | Aeshna verticalis | Large blue dragonfly"></textarea><div class="notice">Format: Common Name | Scientific Name | Notes</div></div><button class="btn-primary" onclick="egAddGroup()">Create group</button><div class="inline-err" id="eg-add-err"></div>`;}
  else if(egMode==='edit'){const isBuiltin=!egEditKey.startsWith('custom_'),group=getAllGroups().find(g=>g.key===egEditKey),species=group?.species||[];body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Editing: ${group?.label||egEditKey}</button></div><div class="eg-section-title">Current species (${species.length})</div><div class="species-edit-list">${species.map((s,i)=>`<div class="species-edit-row"><div><div class="species-edit-name">${s.name}</div><div class="species-edit-sci">${s.sci}</div></div><button class="btn-sm danger" onclick="egRemoveSpecies(${i})">Remove</button></div>`).join('')||'<div style="color:var(--ink-faint);font-size:13px;font-style:italic;padding:8px 0">No species yet.</div>'}</div><hr class="divider"><div class="eg-section-title">Add species</div><div class="add-species-row"><input type="text" id="eg-sp-name" placeholder="Common name"><input type="text" id="eg-sp-sci" placeholder="Scientific name"><input type="text" id="eg-sp-notes" placeholder="Notes"><button class="btn-add-sp" onclick="egAddSpecies()">Add</button></div><div class="inline-err" id="eg-sp-err"></div>${isBuiltin?'<div class="notice" style="margin-top:8px">Removals on built-in groups are saved per account.</div>':''}`;}
}
function egRename(key){egMode='rename';egEditKey=key;renderEditGroups();}
async function egSaveRename(){const newName=document.getElementById('eg-rename-input').value.trim(),err=document.getElementById('eg-rename-err');if(!newName){err.textContent='Please enter a name.';return;}setSyncing();try{await sb.from('group_labels').upsert({user_id:userId,group_key:egEditKey,label:newName},{onConflict:'user_id,group_key'});groupLabels[egEditKey]=newName;setSynced();}catch(e){setSyncError();}buildNav();renderStats();renderGrid();egMode='manage';renderEditGroups();}
function egEdit(key){egMode='edit';egEditKey=key;renderEditGroups();}
async function egDeleteGroup(rawKey){if(!confirm('Delete group "'+getGroupLabel('custom_'+rawKey)+'"?'))return;setSyncing();try{await sb.from('custom_groups').delete().eq('user_id',userId).eq('group_name',rawKey);await sb.from('group_labels').delete().eq('user_id',userId).eq('group_key','custom_'+rawKey);delete customGroups[rawKey];delete groupLabels['custom_'+rawKey];setSynced();}catch(e){setSyncError();}if(currentGroup==='custom_'+rawKey)currentGroup='snakes';buildNav();renderStats();renderGrid();renderEditGroups();}
async function egAddGroup(){const name=document.getElementById('eg-new-name').value.trim(),err=document.getElementById('eg-add-err');if(!name){err.textContent='Please enter a group name.';return;}if(customGroups[name]){err.textContent='That group already exists.';return;}const lines=document.getElementById('eg-new-species').value.split('\n').filter(l=>l.trim()),species=lines.map(l=>{const p=l.split('|');return{name:(p[0]||'').trim(),sci:(p[1]||p[0]||'').trim(),notes:(p[2]||'').trim()};}).filter(s=>s.name);setSyncing();try{await sb.from('custom_groups').upsert({user_id:userId,group_name:name,species_data:species},{onConflict:'user_id,group_name'});customGroups[name]=species;setSynced();}catch(e){setSyncError();}currentGroup='custom_'+name;buildNav();renderStats();renderGrid();egMode='manage';renderEditGroups();}
async function egRemoveSpecies(index){const isBuiltin=!egEditKey.startsWith('custom_');setSyncing();try{if(isBuiltin){const sp=getAllGroups().find(g=>g.key===egEditKey)?.species[index];if(sp){await sb.from('removed_species').upsert({user_id:userId,group_key:egEditKey,sci_name:sp.sci},{onConflict:'user_id,group_key,sci_name'});if(!removedSpecies[egEditKey])removedSpecies[egEditKey]=[];removedSpecies[egEditKey].push(sp.sci);}}else{const rk=egEditKey.replace(/^custom_/,'');const updated=(Array.isArray(customGroups[rk])?customGroups[rk]:[]).filter((_,i)=>i!==index);await sb.from('custom_groups').update({species_data:updated}).eq('user_id',userId).eq('group_name',rk);customGroups[rk]=updated;}setSynced();}catch(e){setSyncError();}buildNav();renderStats();renderGrid();renderEditGroups();}
async function egAddSpecies(){const name=document.getElementById('eg-sp-name').value.trim(),sci=document.getElementById('eg-sp-sci').value.trim(),notes=document.getElementById('eg-sp-notes').value.trim(),err=document.getElementById('eg-sp-err');if(!name){err.textContent='Species name is required.';return;}if(!egEditKey.startsWith('custom_')){err.textContent='You can only add species to custom groups.';return;}const rk=egEditKey.replace(/^custom_/,'');const updated=[...(Array.isArray(customGroups[rk])?customGroups[rk]:[]),{name,sci:sci||name,notes}];setSyncing();try{await sb.from('custom_groups').update({species_data:updated}).eq('user_id',userId).eq('group_name',rk);customGroups[rk]=updated;setSynced();}catch(e){setSyncError();}document.getElementById('eg-sp-name').value='';document.getElementById('eg-sp-sci').value='';document.getElementById('eg-sp-notes').value='';err.textContent='';buildNav();renderStats();renderGrid();renderEditGroups();}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.addEventListener('load',()=>{document.getElementById('loading-screen').style.display='none';document.getElementById('auth-screen').style.display='flex';});
</script>
</body>
