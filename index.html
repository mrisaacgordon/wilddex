<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WildDex — Indiana Wildlife Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #f7f2e8; --paper-dark: #ede6d4; --paper-darker: #e0d6c0;
  --ink: #2c2416; --ink-light: #6b5a3e; --ink-faint: #a89878;
  --border: #c8b898; --border-light: #ddd0b8;
  --green: #5a7a42; --green-light: #7a9a5a; --green-pale: #d4e4c0; --green-wash: #eaf2e0;
  --rust: #8b4a2a; --rust-pale: #f0ddd0;
  --blue: #3a5a78; --blue-pale: #d0dde8;
  --purple: #5a3a6a; --purple-pale: #e0d0ea;
  --teal: #2a6a5a; --teal-pale: #c8e4dc;
  --gold: #8a6a1a; --gold-pale: #f0e4c0;
  --shadow: rgba(44,36,22,0.08);
}
body { font-family: 'Source Sans 3', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; background-image: radial-gradient(ellipse at 20% 10%, rgba(90,122,66,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(58,90,120,0.05) 0%, transparent 50%); }
.auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.auth-card { background: var(--paper); border: 1.5px solid var(--border); border-radius: 4px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 4px 4px 0 var(--border-light), 0 4px 24px var(--shadow); }
.auth-logo { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--green); text-align: center; margin-bottom: 2px; }
.auth-tagline { text-align: center; font-family: 'Lora', serif; font-style: italic; color: var(--ink-light); font-size: 13px; margin-bottom: 6px; }
.auth-divider { text-align: center; margin-bottom: 1.5rem; color: var(--ink-faint); font-size: 16px; letter-spacing: 6px; }
.auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1.5px solid var(--border); }
.auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1.5px; transition: all 0.2s; }
.auth-tab.active { color: var(--green); border-bottom-color: var(--green); }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 11px; color: var(--ink-light); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; padding: 10px 12px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field textarea:focus { border-color: var(--green); background: #fff; }
.field textarea { resize: vertical; min-height: 100px; }
.btn-primary { width: 100%; padding: 12px; background: var(--green); border: none; border-radius: 3px; color: #fff; font-family: 'Lora', serif; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
.btn-primary:hover { background: var(--green-light); }
.auth-error { color: var(--rust); font-size: 13px; margin-top: 0.75rem; text-align: center; font-style: italic; }
.header { background: var(--paper-dark); border-bottom: 1.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 58px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px var(--shadow); }
.header-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--green); }
.header-logo span { font-style: italic; font-weight: 400; color: var(--ink-light); font-size: 13px; margin-left: 8px; }
.header-right { display: flex; align-items: center; gap: 1rem; }
.header-user { font-size: 13px; color: var(--ink-light); font-style: italic; font-family: 'Lora', serif; }
.btn-logout { padding: 6px 14px; background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-light); font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.btn-logout:hover { border-color: var(--green); color: var(--green); }
.nav { background: var(--paper); border-bottom: 1.5px solid var(--border); display: flex; overflow-x: auto; padding: 0 1rem; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-tab { padding: 11px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; margin-bottom: -1.5px; }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
.nav-tab:hover { color: var(--ink-light); }
.main { flex: 1; padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }
.stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat-card { background: var(--paper); border: 1px solid var(--border); border-radius: 3px; padding: 12px 16px; flex: 1; min-width: 110px; box-shadow: 2px 2px 0 var(--border-light); }
.stat-label { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 600; color: var(--green); font-family: 'Playfair Display', serif; }
.progress-bar { height: 3px; background: var(--paper-darker); border-radius: 2px; margin-top: 6px; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s; }
.controls { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-input { width: 100%; padding: 9px 14px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 14px; outline: none; transition: all 0.2s; }
.search-input:focus { border-color: var(--green); background: #fff; }
.filter-btn { padding: 9px 14px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.filter-btn.active { background: var(--green-wash); color: var(--green); border-color: var(--green); }
.edit-groups-btn { padding: 9px 16px; background: var(--paper-dark); border: 1px solid var(--border); border-radius: 3px; color: var(--ink-light); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.edit-groups-btn:hover { border-color: var(--green); color: var(--green); }
.species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
.species-card { background: var(--paper); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: 2px 2px 0 var(--border-light); }
.species-card:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 3px 4px 0 var(--border); }
.species-card.captured { border-color: var(--green); }
.species-photo { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--paper-dark); position: relative; overflow: hidden; }
.species-photo img { width: 100%; height: 100%; object-fit: cover; }
.species-photo.empty { background: var(--paper-darker); }
.question-mark { font-family: 'Playfair Display', serif; font-size: 48px; color: var(--border); font-style: italic; }
.captured-badge { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
.species-info { padding: 10px 10px 12px; }
.species-num { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; margin-bottom: 2px; }
.species-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 2px; font-family: 'Lora', serif; }
.species-sci { font-size: 10px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; line-height: 1.3; }
.species-tag { display: inline-block; margin-top: 7px; padding: 2px 8px; font-size: 10px; border-radius: 2px; }
.tag-snake { background: var(--rust-pale); color: var(--rust); }
.tag-lizard { background: var(--blue-pale); color: var(--blue); }
.tag-turtle { background: var(--teal-pale); color: var(--teal); }
.tag-salamander { background: var(--purple-pale); color: var(--purple); }
.tag-frog { background: var(--green-pale); color: var(--green); }
.tag-bird { background: var(--gold-pale); color: var(--gold); }
.tag-custom { background: var(--paper-darker); color: var(--ink-light); }
.modal-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal { background: var(--paper); border: 1.5px solid var(--border); border-radius: 4px; width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto; box-shadow: 6px 6px 0 var(--border-light), 0 8px 32px var(--shadow); }
.modal-header { padding: 1.25rem 1.5rem; border-bottom: 1.5px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; background: var(--paper-dark); }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ink); }
.modal-sci { font-size: 13px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; margin-top: 2px; }
.modal-close { background: none; border: none; color: var(--ink-faint); font-size: 22px; cursor: pointer; line-height: 1; padding: 2px; flex-shrink: 0; transition: color 0.2s; }
.modal-close:hover { color: var(--rust); }
.modal-body { padding: 1.5rem; }
.modal-photo { width: 100%; aspect-ratio: 16/10; background: var(--paper-darker); border-radius: 3px; border: 1px solid var(--border); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.modal-photo img { width: 100%; height: 100%; object-fit: cover; }
.modal-photo.empty { flex-direction: column; gap: 8px; }
.upload-hint { font-size: 13px; color: var(--ink-faint); font-style: italic; font-family: 'Lora', serif; }
.upload-btn { display: block; padding: 10px 20px; background: var(--paper-dark); border: 1.5px dashed var(--border); border-radius: 3px; color: var(--green); font-family: 'Lora', serif; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center; width: 100%; margin-bottom: 1rem; }
.upload-btn:hover { background: var(--green-wash); border-color: var(--green); }
input[type=file] { display: none; }
.obs-section { background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 1rem; margin-bottom: 1rem; }
.obs-section-title { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--ink-light); margin-bottom: 0.75rem; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
.obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.obs-field label { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.obs-field input, .obs-field textarea, .obs-field select { width: 100%; padding: 7px 10px; background: var(--paper); border: 1px solid var(--border-light); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
.obs-field input:focus, .obs-field textarea:focus, .obs-field select:focus { border-color: var(--green); }
.obs-field textarea { resize: vertical; min-height: 70px; }
.obs-field select { cursor: pointer; }
.obs-full { grid-column: 1 / -1; }
.btn-save-obs { padding: 8px 18px; background: var(--green); border: none; border-radius: 3px; color: #fff; font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: background 0.2s; }
.btn-save-obs:hover { background: var(--green-light); }
.obs-saved { color: var(--green); font-size: 12px; margin-left: 10px; font-style: italic; font-family: 'Lora', serif; opacity: 0; transition: opacity 0.3s; }
.obs-saved.show { opacity: 1; }
.modal-meta { font-size: 13px; color: var(--ink-light); line-height: 1.7; padding: 10px; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; margin-bottom: 0.75rem; font-family: 'Lora', serif; }
.modal-meta strong { color: var(--ink); font-style: normal; font-family: 'Source Sans 3', sans-serif; }
.btn-remove { margin-top: 0.75rem; padding: 7px 14px; background: none; border: 1px solid #c8a898; border-radius: 3px; color: var(--rust); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn-remove:hover { background: var(--rust-pale); }
.eg-tabs { display: flex; border-bottom: 1.5px solid var(--border); margin-bottom: 1.25rem; }
.eg-tab { flex: 1; padding: 9px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1.5px; color: var(--ink-faint); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.eg-tab.active { color: var(--green); border-bottom-color: var(--green); }
.group-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.group-row { display: flex; align-items: center; justify-content: space-between; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 10px 14px; gap: 8px; }
.group-row-name { font-size: 14px; color: var(--ink); font-family: 'Lora', serif; }
.group-row-count { font-size: 12px; color: var(--ink-faint); }
.group-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-sm { padding: 5px 12px; border-radius: 3px; font-family: 'Source Sans 3', sans-serif; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--ink-light); transition: all 0.2s; }
.btn-sm:hover { color: var(--ink); border-color: var(--ink-light); }
.btn-sm.danger { border-color: #c8a898; color: var(--rust); }
.btn-sm.danger:hover { background: var(--rust-pale); }
.btn-sm.primary { border-color: var(--green); color: var(--green); }
.btn-sm.primary:hover { background: var(--green-wash); }
.divider { border: none; border-top: 1px solid var(--border-light); margin: 1rem 0; }
.eg-section-title { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.75rem; }
.species-edit-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; margin-bottom: 1rem; }
.species-edit-row { display: flex; align-items: center; justify-content: space-between; background: var(--paper-dark); border: 1px solid var(--border-light); border-radius: 3px; padding: 8px 12px; gap: 8px; }
.species-edit-name { font-size: 13px; color: var(--ink); font-family: 'Lora', serif; }
.species-edit-sci { font-size: 11px; color: var(--ink-faint); font-style: italic; }
.add-species-row { display: flex; gap: 8px; margin-top: 0.5rem; flex-wrap: wrap; }
.add-species-row input { flex: 1; min-width: 110px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; }
.add-species-row input:focus { border-color: var(--green); }
.btn-add-sp { padding: 8px 14px; background: var(--green-wash); border: 1px solid var(--green); border-radius: 3px; color: var(--green); font-family: 'Lora', serif; font-size: 13px; cursor: pointer; }
.btn-add-sp:hover { background: var(--green-pale); }
.notice { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-top: 6px; font-family: 'Lora', serif; }
.inline-err { color: var(--rust); font-size: 12px; margin-top: 6px; min-height: 18px; font-style: italic; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--ink-faint); font-size: 15px; font-family: 'Lora', serif; font-style: italic; }
@media (max-width: 500px) {
  .species-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .main { padding: 1rem; } .stats-bar { gap: 8px; } .stat-card { padding: 10px 12px; }
  .obs-grid { grid-template-columns: 1fr; } .modal { max-width: 100%; }
}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">WildDex</div>
    <div class="auth-tagline">Indiana Wildlife Field Guide</div>
    <div class="auth-divider">· · ·</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Create Account</button>
    </div>
    <div class="field"><label>Username</label><input type="text" id="auth-username" placeholder="your username" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Sign In</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="main-app" style="display:none;flex-direction:column;min-height:100vh;">
  <div class="header">
    <div class="header-logo">WildDex <span>Indiana Field Guide</span></div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="nav" id="nav-tabs"></div>
  <div class="main">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="controls">
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Search species..." oninput="renderGrid()">
      </div>
      <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="filter-captured" onclick="setFilter('captured')">Photographed</button>
      <button class="filter-btn" id="filter-missing" onclick="setFilter('missing')">Still needed</button>
      <button class="edit-groups-btn" onclick="showEditGroups()">Edit groups</button>
    </div>
    <div class="species-grid" id="species-grid"></div>
  </div>
</div>

<div class="modal-overlay" id="species-modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div><div class="modal-title" id="modal-name"></div><div class="modal-sci" id="modal-sci"></div></div>
      <button class="modal-close" onclick="closeSpeciesModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-photo" id="modal-photo-wrap"></div>
      <label class="upload-btn" for="file-input">📷  Upload your photo</label>
      <input type="file" id="file-input" accept="image/*" onchange="handleUpload(event)">
      <div id="modal-remove-btn"></div>
      <div class="obs-section">
        <div class="obs-section-title">Observation Details</div>
        <div class="obs-grid">
          <div class="obs-field"><label>Date</label><input type="date" id="obs-date"></div>
          <div class="obs-field"><label>Time</label><input type="time" id="obs-time"></div>
          <div class="obs-field obs-full"><label>Location</label><input type="text" id="obs-location" placeholder="e.g. Goose Pond FWA, Greene Co."></div>
          <div class="obs-field">
            <label>Weather</label>
            <select id="obs-weather">
              <option value="">—</option>
              <option>Sunny</option><option>Partly cloudy</option><option>Overcast</option>
              <option>Rainy</option><option>Foggy</option><option>Windy</option><option>After rain</option>
            </select>
          </div>
          <div class="obs-field"><label>Behavior observed</label><input type="text" id="obs-behavior" placeholder="e.g. basking, hunting"></div>
          <div class="obs-field obs-full"><label>Animal details</label><input type="text" id="obs-details" placeholder="e.g. adult male, ~60cm, juvenile coloring"></div>
          <div class="obs-field obs-full"><label>Notes</label><textarea id="obs-notes" placeholder="Anything else worth remembering about this sighting..."></textarea></div>
        </div>
        <button class="btn-save-obs" onclick="saveObs()">Save observation</button>
        <span class="obs-saved" id="obs-saved-msg">Saved ✓</span>
      </div>
      <div class="modal-meta" id="modal-meta"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editgroups-modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" style="max-width:560px" onclick="event.stopPropagation()">
    <div class="modal-header"><div class="modal-title">Edit groups</div><button class="modal-close" onclick="document.getElementById('editgroups-modal').style.display='none'">×</button></div>
    <div class="modal-body" id="editgroups-body"></div>
  </div>
</div>

</div>
<script>

retions."},{name:"Cave Salamander",sci:"Eurycea lucifuga",notes:"Orange-red with spots. Cave and cliff faces."},{name:"Long-tailed Salamander",sci:"Eurycea longicauda",notes:"Long tail, yellow with black spots. Springs and streams."},{name:"Northern Two-lined Salamander",sci:"Eurycea bislineata",notes:"Yellow with two dark stripes. Rocky streams."},{name:"Spring Salamander",sci:"Gyrinophilus porphyriticus",notes:"Large, salmon-colored. Cold springs. Southern Indiana."},{name:"Mudpuppy",sci:"Necturus maculosus",notes:"Fully aquatic, never metamorphoses. Bushy red gills."},{name:"Red-spotted Newt",sci:"Notophthalmus viridescens",notes:"Three life stages. Red eft juveniles wander on land."},{name:"Hellbender",sci:"Cryptobranchus alleganiensis",notes:"Giant aquatic salamander. Endangered. Clean, rocky rivers."},{name:"Lesser Siren",sci:"Siren intermedia",notes:"Eel-like, two front legs only. Muddy ponds."}]},frogs:{label:"Frogs & Toads",color:"tag-frog",species:[{name:"American Bullfrog",sci:"Lithobates catesbeianus",notes:"Largest Indiana frog. Deep jug-o-rum call."},{name:"Green Frog",sci:"Lithobates clamitans",notes:"Common pond frog. Twangy banjo-string call."},{name:"Northern Leopard Frog",sci:"Lithobates pipiens",notes:"Spotted, grassland frog. Snoring call."},{name:"Southern Leopard Frog",sci:"Lithobates sphenocephalus",notes:"Similar to northern. Southern Indiana."},{name:"Pickerel Frog",sci:"Lithobates palustris",notes:"Square spots in rows. Mild skin toxins. Cold streams."},{name:"Wood Frog",sci:"Lithobates sylvaticus",notes:"Robber's mask. Freezes solid in winter. Early breeder."},{name:"Crawfish Frog",sci:"Lithobates areolatus",notes:"Uses crawfish burrows. State special concern."},{name:"American Toad",sci:"Anaxyrus americanus",notes:"Most common toad. Long musical trill."},{name:"Fowler's Toad",sci:"Anaxyrus fowleri",notes:"Similar to American toad. Harsh bleating call."},{name:"Eastern Spadefoot Toad",sci:"Scaphiopus holbrookii",notes:"Vertical pupils. Explosive breeder after heavy rain."},{name:"Eastern Gray Treefrog",sci:"Hyla versicolor",notes:"Changes color. Loud trilling call from treetops."},{name:"Cope's Gray Treefrog",sci:"Hyla chrysoscelis",notes:"Identical to Eastern gray. Faster trill. Diploid."},{name:"Spring Peeper",sci:"Pseudacris crucifer",notes:"X on back. Loud high-pitched peep. First spring voice."},{name:"Western Chorus Frog",sci:"Pseudacris triseriata",notes:"Tiny. Finger-on-comb call. Vernal pools."},{name:"Boreal Chorus Frog",sci:"Pseudacris maculata",notes:"Northern Indiana. Similar to western chorus frog."},{name:"Mountain Chorus Frog",sci:"Pseudacris brachyphona",notes:"Rare. Southern hills. Reverse parentheses markings."},{name:"Bird-voiced Treefrog",sci:"Hyla avivoca",notes:"Rare. Extreme southwest Indiana. Birdlike call."},{name:"Plains Leopard Frog",sci:"Lithobates blairi",notes:"Western Indiana. Spotted. Chuckling call."}]},birds:{label:"Birds",color:"tag-bird",species:[{name:"American Robin",sci:"Turdus migratorius",notes:"Year-round. Red-orange breast. Familiar yard bird."},{name:"Northern Cardinal",sci:"Cardinalis cardinalis",notes:"Year-round. Brilliant red male. Sings year-round."},{name:"Blue Jay",sci:"Cyanocitta cristata",notes:"Year-round. Loud, bold, intelligent."},{name:"Black-capped Chickadee",sci:"Poecile atricapillus",notes:"Year-round north. Acrobatic. Tiny."},{name:"Carolina Chickadee",sci:"Poecile carolinensis",notes:"Year-round south Indiana."},{name:"Tufted Titmouse",sci:"Baeolophus bicolor",notes:"Year-round. Gray crest. Loud peter-peter call."},{name:"White-breasted Nuthatch",sci:"Sitta carolinensis",notes:"Year-round. Walks headfirst down trees."},{name:"Downy Woodpecker",sci:"Picoides pubescens",notes:"Smallest woodpecker. Year-round. Common feeder bird."},{name:"Hairy Woodpecker",sci:"Leuconotopicus villosus",notes:"Larger than downy. Year-round. Longer bill."},{name:"Red-bellied Woodpecker",sci:"Melanerpes carolinus",notes:"Year-round. Red cap. Loud churr call."},{name:"Pileated Woodpecker",sci:"Dryocopus pileatus",notes:"Crow-sized. Loud. Rectangular excavations in dead trees."},{name:"Northern Flicker",sci:"Colaptes auratus",notes:"Brownish woodpecker. Spots on breast. Ant specialist."},{name:"American Crow",sci:"Corvus brachyrhynchos",notes:"Year-round. Highly intelligent. Roosts in large flocks."},{name:"Eastern Bluebird",sci:"Sialia sialis",notes:"Cavity nester. Brilliant blue and rust. Nest boxes."},{name:"American Goldfinch",sci:"Spinus tristis",notes:"Bright yellow male in summer. Thistle seed lover."},{name:"House Finch",sci:"Haemorhous mexicanus",notes:"Year-round. Red-headed male. Common at feeders."},{name:"Dark-eyed Junco",sci:"Junco hyemalis",notes:"Winter visitor. Slate gray and white. Snowbird."},{name:"White-throated Sparrow",sci:"Zonotrichia albicollis",notes:"Winter visitor. White throat patch."},{name:"Song Sparrow",sci:"Melospiza melodia",notes:"Year-round. Heavy breast streaking. Complex song."},{name:"House Sparrow",sci:"Passer domesticus",notes:"Year-round. Non-native. Ubiquitous in towns."},{name:"European Starling",sci:"Sturnus vulgaris",notes:"Year-round. Non-native. Iridescent in spring."},{name:"Red-winged Blackbird",sci:"Agelaius phoeniceus",notes:"Marsh breeder. Males with red shoulder patches."},{name:"Common Grackle",sci:"Quiscalus quiscula",notes:"Iridescent black. Yellow eye. Large flocks."},{name:"Baltimore Oriole",sci:"Icterus galbula",notes:"Summer breeder. Flame orange and black. Pendant nest."},{name:"Eastern Meadowlark",sci:"Sturnella magna",notes:"Declining. Yellow breast, V-shaped necklace. Meadows."},{name:"Ruby-throated Hummingbird",sci:"Archilochus colubris",notes:"Summer only. Only nesting hummingbird in Indiana."},{name:"Chimney Swift",sci:"Chaetura pelagica",notes:"Summer. Cigar with wings. Chatters overhead in evenings."},{name:"Barn Swallow",sci:"Hirundo rustica",notes:"Summer. Deeply forked tail. Nests on structures."},{name:"Tree Swallow",sci:"Tachycineta bicolor",notes:" let currentUser=null,allUsers={},currentGroup='snakes',currentFilter='all',currentSpecies=null,authMode='login',egMode='manage',egEditKey=null;
function loadData(){try{const d=localStorage.getItem('wilddex_v3');if(d)allUsers=JSON.parse(d);}catch(e){}}
function saveData(){try{localStorage.setItem('wilddex_v3',JSON.stringify(allUsers));}catch(e){}}
function switchAuthTab(m){authMode=m;document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&m==='login')||(i===1&&m==='register')));document.getElementById('auth-error').textContent='';document.getElementById('auth-btn').textContent=m==='login'?'Sign In':'Create Account';}
function handleAuth(){const u=document.getElementById('auth-username').value.trim(),p=document.getElementById('auth-password').value,err=document.getElementById('auth-error');if(!u||!p){err.textContent='Please fill in all fields.';return;}if(authMode==='register'){if(allUsers[u]){err.textContent='Username already taken.';return;}if(p.length<4){err.textContent='Password must be at least 4 characters.';return;}allUsers[u]={password:p,photos:{},obs:{},customGroups:{},removedSpecies:{}};}else{if(!allUsers[u]||allUsers[u].password!==p){err.textContent='Invalid username or password.';return;}}saveData();currentUser=u;['customGroups','removedSpecies','photos','obs'].forEach(k=>{if(!allUsers[u][k])allUsers[u][k]={};});document.getElementById('auth-screen').style.display='none';document.getElementById('main-app').style.display='flex';document.getElementById('header-user').textContent=u;buildNav();renderStats();renderGrid();}
function logout(){currentUser=null;document.getElementById('auth-screen').style.display='flex';document.getElementById('main-app').style.display='none';document.getElementById('auth-username').value='';document.getElementById('auth-password').value='';}
function getCustomGroups(){return allUsers[currentUser]?.customGroups||{};}
function getAllGroups(){const rem=allUsers[currentUser]?.removedSpecies||{};const built=Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,label:v.label,color:v.color,builtin:true,species:v.species.filter(s=>!(rem[k]||[]).includes(s.sci))}));const cg=getCustomGroups();const custom=Object.entries(cg).map(([k,v])=>({key:'custom_'+k,label:k,color:'tag-custom',builtin:false,species:v.species||[]}));return[...built,...custom];}
function buildNav(){const nav=document.getElementById('nav-tabs');nav.innerHTML='';getAllGroups().forEach(g=>{const b=document.createElement('button');b.className='nav-tab'+(g.key===currentGroup?' active':'');b.textContent=g.label;b.onclick=()=>{currentGroup=g.key;currentFilter='all';document.getElementById('search-input').value='';buildNav();renderStats();renderGrid();};nav.appendChild(b);});}
function getUserPhotos(){return allUsers[currentUser]?.photos||{};}
function getUserObs(){return allUsers[currentUser]?.obs||{};}
function getCurrentGroupData(){return getAllGroups().find(g=>g.key===currentGroup)||getAllGroups()[0];}
function renderStats(){const g=getCurrentGroupData(),ph=getUserPhotos(),total=g.species.length,cap=g.species.filter(s=>ph[currentGroup+'_'+s.sci]).length,pct=total>0?Math.round(cap/total*100):0;document.getElementById('stats-bar').innerHTML=`<div class="stat-card"><div class="stat-label">${g.label} photographed</div><div class="stat-value">${cap} / ${total}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="stat-card"><div class="stat-label">Completion</div><div class="stat-value">${pct}%</div></div><div class="stat-card"><div class="stat-label">Still needed</div><div class="stat-value">${total-cap}</div></div>`;}
function setFilter(f){currentFilter=f;['all','captured','missing'].forEach(x=>document.getElementById('filter-'+x).classList.toggle('active',x===f));renderGrid();}
function renderGrid(){const g=getCurrentGroupData(),ph=getUserPhotos(),search=document.getElementById('search-input').value.toLowerCase();let sp=g.species.filter(s=>{const has=!!ph[currentGroup+'_'+s.sci];if(currentFilter==='captured'&&!has)return false;if(currentFilter==='missing'&&has)return false;if(search&&!s.name.toLowerCase().includes(search)&&!s.sci.toLowerCase().includes(search))return false;return true;});const grid=document.getElementById('species-grid');if(!sp.length){grid.innerHTML='<div class="empty-state">No species match your filters.</div>';return;}grid.innerHTML=sp.map(s=>{const key=currentGroup+'_'+s.sci,photo=ph[key],num=String(g.species.indexOf(s)+1).padStart(3,'0');return`<div class="species-card ${photo?'captured':''}" onclick="openSpecies('${currentGroup}','${s.sci.replace(/'/g,"\\'")}')"><div class="species-photo ${photo?'':'empty'}">${photo?`<img src="${photo}" alt="${s.name}">`:'<div class="question-mark">?</div>'}${photo?'<div class="captured-badge">✓</div>':''}</div><div class="species-info"><div class="species-num">#${num}</div><div class="species-name">${s.name}</div><div class="species-sci">${s.sci}</div><span class="species-tag ${g.color}">${g.label.replace(/s$/,'').replace(/ & Toads$/,'')}</span></div></div>`;}).join('');}
function openSpecies(groupKey,sci){const group=getAllGroups().find(g=>g.key===groupKey),s=group?.species.find(sp=>sp.sci===sci);if(!s)return;currentSpecies={groupKey,sci};const ph=getUserPhotos(),obs=getUserObs(),key=groupKey+'_'+sci,photo=ph[key],od=obs[key]||{};document.getElementById('modal-name').textContent=s.name;document.getElementById('modal-sci').textContent=s.sci;const wrap=document.getElementById('modal-photo-wrap');if(photo){wrap.className='modal-photo';wrap.innerHTML=`<img src="${photo}" alt="${s.name}">`;}else{wrap.className='modal-photo empty';wrap.innerHTML='<div class="question-mark" style="font-size:56px">?</div><div class="upload-hint">No photo yet</div>';}document.getElementById('modal-remove-btn').innerHTML=photo?'<button class="btn-remove" onclick="removePhoto()">Remove photo</button>':'';document.getElementById('obs-date').value=od.date||'';document.getElementById('obs-time').value=od.time||'';document.getElementById('obs-location').value=od.location||'';document.getElementById('obs-weather').value=od.weather||'';document.getElementById('obs-behavior').value=od.behavior||'';document.getElementById('obs-details').value=od.details||'';document.getElementById('obs-notes').value=od.notes||'';document.getElementById('obs-saved-msg').classList.remove('show');document.getElementById('modal-meta').innerHTML=`<strong>Field notes:</strong> ${s.notes||'No notes available.'}`;document.getElementById('species-modal').style.display='flex';}
function saveObs(){if(!currentSpecies)return;const key=currentSpecies.groupKey+'_'+currentSpecies.sci;if(!allUsers[currentUser].obs)allUsers[currentUser].obs={};allUsers[currentUser].obs[key]={date:document.getElementById('obs-date').value,time:document.getElementById('obs-time').value,location:document.getElementById('obs-location').value,weather:document.getElementById('obs-weather').value,behavior:document.getElementById('obs-behavior').value,details:document.getElementById('obs-details').value,notes:document.getElementById('obs-notes').value};saveData();const msg=document.getElementById('obs-saved-msg');msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);}
function closeSpeciesModal(){document.getElementById('species-modal').style.display='none';document.getElementById('file-input').value='';currentSpecies=null;}
function closeModal(e){if(e.target.classList.contains('modal-overlay')){document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none');currentSpecies=null;document.getElementById('file-input').value='';}}
function handleUpload(event){const file=event.target.files[0];if(!file||!currentSpecies)return;const reader=new FileReader();reader.onload=e=>{if(!allUsers[currentUser].photos)allUsers[currentUser].photos={};allUsers[currentUser].photos[currentSpecies.groupKey+'_'+currentSpecies.sci]=e.target.result;saveData();openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();};reader.readAsDataURL(file);}
function removePhoto(){if(!currentSpecies)return;delete allUsers[currentUser].photos[currentSpecies.groupKey+'_'+currentSpecies.sci];saveData();openSpecies(currentSpecies.groupKey,currentSpecies.sci);renderStats();renderGrid();}
function showEditGroups(){egMode='manage';egEditKey=null;renderEditGroups();document.getElementById('editgroups-modal').style.display='flex';}
function renderEditGroups(){const body=document.getElementById('editgroups-body'),cg=getCustomGroups(),allG=[...Object.entries(SPECIES_DATA).map(([k,v])=>({key:k,rawKey:k,label:v.label,builtin:true,count:getAllGroups().find(g=>g.key===k)?.species.length??v.species.length})),...Object.entries(cg).map(([k,v])=>({key:'custom_'+k,rawKey:k,label:k,builtin:false,count:(v.species||[]).length}))];if(egMode==='manage'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab active">Manage groups</button><button class="eg-tab" onclick="egMode='add';renderEditGroups()">+ Add new group</button></div><div class="group-list">${allG.map(g=>`<div class="group-row"><div><div class="group-row-name">${g.label}</div><div class="group-row-count">${g.count} species${g.builtin?' · built-in':''}</div></div><div class="group-row-actions"><button class="btn-sm primary" onclick="egEdit('${g.key}')">Edit species</button>${!g.builtin?`<button class="btn-sm danger" onclick="egDeleteGroup('${g.rawKey}')">Delete</button>`:''}</div></div>`).join('')}</div>`;}else if(egMode==='add'){body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Add new group</button></div><div class="field"><label>Group name</label><input type="text" id="eg-new-name" placeholder="e.g. Dragonflies, Mammals..."></div><div class="field"><label>Species — one per line</label><textarea id="eg-new-species" placeholder="Common Name | Scientific Name | Notes&#10;Eastern Darner | Aeshna verticalis | Large blue dragonfly"></textarea><div class="notice">Format: Common Name | Scientific Name | Notes</div></div><button class="btn-primary" onclick="egAddGroup()">Create group</button><div class="inline-err" id="eg-add-err"></div>`;}else if(egMode==='edit'){const isBuiltin=!egEditKey.startsWith('custom_'),group=getAllGroups().find(g=>g.key===egEditKey),species=group?.species||[];body.innerHTML=`<div class="eg-tabs"><button class="eg-tab" onclick="egMode='manage';renderEditGroups()">← Back</button><button class="eg-tab active">Editing: ${group?.label||egEditKey}</button></div><div class="eg-section-title">Current species (${species.length})</div><div class="species-edit-list">${species.map((s,i)=>`<div class="species-edit-row"><div><div class="species-edit-name">${s.name}</div><div class="species-edit-sci">${s.sci}</div></div><button class="btn-sm danger" onclick="egRemoveSpecies(${i})">Remove</button></div>`).join('')||'<div style="color:var(--ink-faint);font-size:13px;font-style:italic;padding:8px 0">No species yet.</div>'}</div><hr class="divider"><div class="eg-section-title">Add species</div><div class="add-species-row"><input type="text" id="eg-sp-name" placeholder="Common name"><input type="text" id="eg-sp-sci" placeholder="Scientific name"><input type="text" id="eg-sp-notes" placeholder="Notes"><button class="btn-add-sp" onclick="egAddSpecies()">Add</button></div><div class="inline-err" id="eg-sp-err"></div>${isBuiltin?'<div class="notice" style="margin-top:8px">Removals on built-in groups are saved per account only.</div>':''}`;}}
function egEdit(key){egMode='edit';egEditKey=key;renderEditGroups();}
function egDeleteGroup(rawKey){if(!confirm('Delete group "'+rawKey+'"?'))return;delete allUsers[currentUser].customGroups[rawKey];saveData();if(currentGroup==='custom_'+rawKey)currentGroup='snakes';buildNav();renderStats();renderGrid();renderEditGroups();}
function egAddGroup(){const name=document.getElementById('eg-new-name').value.trim(),err=document.getElementById('eg-add-err');if(!name){err.textContent='Please enter a group name.';return;}if(getCustomGroups()[name]){err.textContent='That group already exists.';return;}const lines=document.getElementById('eg-new-species').value.split('\n').filter(l=>l.trim()),species=lines.map(l=>{const p=l.split('|');return{name:(p[0]||'').trim(),sci:(p[1]||p[0]||'').trim(),notes:(p[2]||'').trim()};}).filter(s=>s.name);allUsers[currentUser].customGroups[name]={species};saveData();currentGroup='custom_'+name;buildNav();renderStats();renderGrid();egMode='manage';renderEditGroups();}
function egRemoveSpecies(index){const isBuiltin=!egEditKey.startsWith('custom_');if(isBuiltin){if(!allUsers[currentUser].removedSpecies)allUsers[currentUser].removedSpecies={};if(!allUsers[currentUser].removedSpecies[egEditKey])allUsers[currentUser].removedSpecies[egEditKey]=[];const sp=getAllGroups().find(g=>g.key===egEditKey)?.species[index];if(sp)allUsers[currentUser].removedSpecies[egEditKey].push(sp.sci);}else{const rk=egEditKey.replace(/^custom_/,'');allUsers[currentUser].customGroups[rk].species.splice(index,1);}saveData();buildNav();renderStats();renderGrid();renderEditGroups();}
function egAddSpecies(){const name=document.getElementById('eg-sp-name').value.trim(),sci=document.getElementById('eg-sp-sci').value.trim(),notes=document.getElementById('eg-sp-notes').value.trim(),err=document.getElementById('eg-sp-err');if(!name){err.textContent='Species name is required.';return;}if(!egEditKey.startsWith('custom_')){err.textContent='You can only add species to custom groups.';return;}const rk=egEditKey.replace(/^custom_/,'');if(!allUsers[currentUser].customGroups[rk].species)allUsers[currentUser].customGroups[rk].species=[];allUsers[currentUser].customGroups[rk].species.push({name,sci:sci||name,notes});saveData();document.getElementById('eg-sp-name').value='';document.getElementById('eg-sp-sci').value='';document.getElementById('eg-sp-notes').value='';err.textContent='';buildNav();renderStats();renderGrid();renderEditGroups();}
loadData();
</script>
</body>
</html>
